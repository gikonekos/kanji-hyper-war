    display: none; position: fixed; inset: 0;
    align-items: flex-end; justify-content: center;

  }

<script>
(function(){
"use strict";

/* ============================================================
   漢字超戦 v2
   ------------------------------------------------------------
   今回の更新:
   - ステージごとの敵編隊挙動を分離（第一形態=横移動→降下の
     編隊行進、第二形態=編隊はゆるく漂い個々の敵がsin/cosで
     急降下→復帰、第三形態=グループ単位でsin/cosの編隊降下）
   - ボス出現演出：編隊一掃→2秒待機→黄地に黒文字の「警告！」
     （罫線で囲み、下にステージ別の小文字テロップ）→2秒後に接敵
   - ボスは複数種類からランダム選出
   - 星は「・」のみ、控えめな配色・数に調整
   - PLAY3方式のMML再生を実装（Dash!イントロ／VEZAR全曲ループ／
     プロムナード）。tone_value/length_dataは実機解析値を使用

   なお、Dash!/プロムナードのMMLはユーザー提供のBASICリストを
   最大限忠実に解釈したものですが、一部（複数行にまたがる記法や
   句読点の揺れ）は合理的な解釈で補っています。実機で聴き比べて
   微調整すると良さそうです。
   ============================================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const KCV_VERSION = 'kcv78';

/* ---------- 画面 / グリッド設定 ---------- */
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
let cols=24, rows=14, cell=20, isLandscape=true;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  isLandscape = W >= H;
  const oldCols = cols, oldRows = rows;
  if(isLandscape){ cols=24; rows=14; } else { cols=14; rows=24; }
  cell = Math.min(W/cols, H/rows);
  if(typeof player!=='undefined' && (oldCols!==cols || oldRows!==rows) && oldCols>0 && oldRows>0){
    // グリッド比率が変わった分だけ自機位置を追従させる（向き変更時のリスケール、位置ズレのバグ修正）
    player.x = player.x/oldCols*cols;
    player.y = player.y/oldRows*rows;
  }
  initStars();
  if(stageIndex >= 2 && !warpActive) initMatrixStreams(); // ステージ3以降でリサイズされたらMatrixも再構築
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

function gx(u){ return (W-cols*cell)/2 + u*cell; }
function gy(u){ return (H-rows*cell)/2 + u*cell; }

/* ============================================================
   描画ユーティリティ（構造化：同一の定型処理をここへ集約）
   ============================================================ */
// Canvasの文字描画は「save→整列・フォント・色を指定→fillText→restore」の定型が全体に散在していたため一本化する
function drawText(text, x, y, o){
  o = o || {};
  ctx.save();
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.font = (o.bold ? 'bold ' : '') + (o.size != null ? o.size : cell) + 'px monospace';
  ctx.fillStyle = o.color || '#fff';
  if(o.alpha != null) ctx.globalAlpha = Math.max(0, o.alpha);
  ctx.fillText(text, x, y);
  ctx.restore();
}
// 残り寿命に応じて薄くなる文字（パーティクル・ポップアップ）の描画。両者で同一処理だったため共通化
function drawFadingChars(list, size, bold, textKey){
  list.forEach(p=>{
    drawText(p[textKey], gx(p.x), gy(p.y), { size: size, bold: bold, color: p.color, alpha: 1 - p.t/p.life });
  });
}
function drawParticleLayer(){ drawFadingChars(particles, cell*0.6, false, 'ch'); }
function drawPopupLayer(){ drawFadingChars(popups, cell*0.7, true, 'text'); }
// 自機「自」の描画（通常時と、クリア演出中とで同一のため共通化）
function drawPlayerChar(alpha){
  drawText('自', gx(player.x), gy(player.y), { size: cell*1.1, bold: true, color: '#3bff88', alpha: alpha });
}

// ステージ3（ギャラガ）専用：意味のある8文字フレーズ編隊。他ステージの通常敵とは文字を共有しない（予約）

const BOSS_CHARS = new Set(BOSS_POOL.map(b=>b[0]));
const PHRASE_CHARS = new Set(PHRASE_POOL.flatMap(p=>p.text.split('')));
const REGULAR_POOL = KANJI_POOL.filter(k=>!BOSS_CHARS.has(k[0]) && !PHRASE_CHARS.has(k[0]) && k[1]<=12); // 通常ステージにはボス級の硬さ・ステージ3専用漢字を出さない
const TIER_WEAK   = REGULAR_POOL.filter(k=>k[1]<=4);
const TIER_MEDIUM = REGULAR_POOL.filter(k=>k[1]>4 && k[1]<=9);
const TIER_STRONG = REGULAR_POOL.filter(k=>k[1]>9);
const usedRegularChars = new Set();
function pickFromTier(tier){
  const pool = (tier && tier.length) ? tier : REGULAR_POOL;
  let avail = pool.filter(k=>!usedRegularChars.has(k[0]));
  if(avail.length===0){
    // このプールでは使い切った。全体プールも枯渇していれば履歴をリセットして再び使えるようにする
    if(usedRegularChars.size >= REGULAR_POOL.length){ usedRegularChars.clear(); }
    avail = pool.filter(k=>!usedRegularChars.has(k[0]));
    if(avail.length===0) avail = pool; // それでも空なら（プールが小さい等）そのまま許容
  }
  const pick = avail[Math.floor(Math.random()*avail.length)];
  usedRegularChars.add(pick[0]);
  return pick;
}

/* ---------- 漢数字変換（超巨大数対応） ---------- */
const KSU=['','一','二','三','四','五','六','七','八','九'];
function conv4(n){
  if(n===0) return '';
  let s='';
  const th=Math.floor(n/1000),hu=Math.floor((n%1000)/100),te=Math.floor((n%100)/10),on=n%10;
  if(th) s+=(th===1?'':KSU[th])+'千';
  if(hu) s+=(hu===1?'':KSU[hu])+'百';
  if(te) s+=(te===1?'':KSU[te])+'十';
  if(on) s+=KSU[on];
  return s;
}
function kanjiNum(n){
  if(typeof n !== 'bigint') n = BigInt(Math.floor(n));
  if(n === 0n) return '〇';

  const oku  = n / 100000000n;
  const cho  = n / 1000000000000n;
  const kei  = n / 10000000000000000n;

  let s = '';
  if(kei > 0n) s += conv4(Number(kei)) + '京';
  if(cho > 0n) s += conv4(Number(cho % 10000n)) + '兆';
  if(oku > 0n) s += conv4(Number(oku % 10000n)) + '億';
  const man = (n % 100000000n) / 10000n;
  if(man > 0n || kei > 0n || cho > 0n || oku > 0n) s += conv4(Number(man)) + '万';
  s += conv4(Number(n % 10000n));

  return s || '〇';
}

/* ============================================================
   PLAY3 MML再生エンジン
   ============================================================ */

/* ============================================================
   音楽エンジン（PC-E500 PLAY3方式のMML解釈と再生）
   ============================================================ */
const TONE_TABLE = {
  R:  [0,0,0,0,0],
  C:  [0x12e,0x97,0x4c,0x26,0x13],
  '#C':[0x11d,0x8f,0x48,0x24,0x12],
  D:  [0x10d,0x87,0x44,0x22,0x11],
  '#D':[0xfe,0x7f,0x40,0x20,0x10],
  E:  [0xf0,0x78,0x3c,0x1e,0xf],
  F:  [0xe2,0x71,0x39,0x1d,0xf],
  '#F':[0xd6,0x6b,0x36,0x1b,0xe],
  G:  [0xca,0x65,0x33,0x1a,0xd],
  '#G':[0xbe,0x5f,0x30,0x18,0xc],
  A:  [0xb4,0x5a,0x2d,0x17,0xc],
  '#A':[0xaa,0x55,0x2b,0x16,0xb],
  B:  [0xa0,0x50,0x28,0x14,0xa]
};
const LENGTH_TABLE = [3,6,9,12,18,24,36,48,72,96];

function freqFor(name, oct){
  oct = Math.max(0, Math.min(4, oct));
  const row = TONE_TABLE[name];
  if(!row) return 0;
  const tv = row[oct];
  if(!tv) return 0;
  return 20800/(2*tv);
}
function durMs(lenIdx, tempo){
  const lv = LENGTH_TABLE[lenIdx]!==undefined ? LENGTH_TABLE[lenIdx] : LENGTH_TABLE[5];
  const quarterMs = tempo*4.8077;
  return quarterMs * (lv/24);
}

function parseMMLPart(str, state){
  state = state || {oct:3, defLen:5};
  let i=0, tempOct=null;
  const events=[];
  while(i<str.length){
    const c=str[i];
    if(c==='O'){ i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} state.oct=parseInt(d,10); continue; }
    if(c==='>'){ state.oct++; i++; continue; }
    if(c==='<'){ state.oct--; i++; continue; }
    if(c==='L'){ i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} if(d) state.defLen=parseInt(d,10); continue; }
    if(c==='T'){ i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} continue; }
    if(c==='R'){ i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} const len=d?parseInt(d,10):state.defLen; events.push({freq:0,len}); continue; }
    if(c==='+'||c==='-'){ const sign=c; i++; if(tempOct===null) tempOct=state.oct; state.oct += (sign==='+'?1:-1); continue; }
    if(c==='#'){ i++; const n=str[i]||''; i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} const len=d?parseInt(d,10):state.defLen;
      events.push({freq:freqFor('#'+n,state.oct), len});
      if(tempOct!==null){ state.oct=tempOct; tempOct=null; }
      continue; }
    if(/[A-G]/.test(c)){ i++; let d=''; while(i<str.length&&/[0-9]/.test(str[i])){d+=str[i];i++;} const len=d?parseInt(d,10):state.defLen;
      events.push({freq:freqFor(c,state.oct), len});
      if(tempOct!==null){ state.oct=tempOct; tempOct=null; }
      continue; }
    i++;
  }
  return events;
}

function tieMergeStream(events){
  // 同音高が連続する場合、再トリガーせず1つの音として長さを合算する（タイ／スラー処理）
  const out=[];
  events.forEach(ev=>{
    const last = out[out.length-1];
    if(last && ev.freq>0 && last.freq===ev.freq){
      last.ms += ev.ms;
    } else {
      out.push({freq:ev.freq, ms:ev.ms});
    }
  });
  return out;
}

function scheduleSong(actx, segments, tempo, loop, gainVal, tieRepeats){
  gainVal = gainVal!==undefined?gainVal:0.13;
  // 手順は2段階：
  // ①MMLを行（元のPLAY文1行）単位で解析し、パート間で足りない分を休符として明示的に追加する
  // ②休符補完済みの3パートを1本ずつの連続イベント列にまとめ、全音符（whole note）1つ分の
  //   長さで改めて分割し直す。これをスケジューリングの最小単位（小節）として扱う。
  //   → 元のPLAY文の行の長さに引きずられた不自然な休符（例：プロムナードのF9D9C9のような
  //   全音符の連続）が解消される。
  const partStates = [{oct:3,defLen:5},{oct:3,defLen:5},{oct:3,defLen:5}];

  // ①行ごとに解析。休符補完は「最初の長い1行」の足りない末尾にのみ適用する
  //  （全行に汎用適用していたのが途切れ症状の原因の可能性があるため、範囲を限定）
  const streams = [[],[],[]];
  segments.forEach((seg, segIdx)=>{
    const parts = seg.map((s,k)=>
      parseMMLPart(s||'', partStates[k]).map(ev=>({freq:ev.freq, ms:durMs(ev.len,tempo)}))
    );
    if(segIdx===0){
      const lineDurMs = Math.max(...parts.map(evs=>evs.reduce((sum,e)=>sum+e.ms,0)));
      parts.forEach(evs=>{
        const durMsSum = evs.reduce((sum,e)=>sum+e.ms,0);
        if(lineDurMs - durMsSum > 0.01) evs.push({freq:0, ms:lineDurMs-durMsSum}); // 最初の行だけ足りない分を休符で補完
        // 訂正：ここに固定長(durMs(3,tempo))の休符を無条件で追加していたのを削除。
        // 実際の音長から導かれていない決め打ちの休符がずれの原因と疑われるため（要実機確認）。
      });
    }
    parts.forEach((evs,k)=>{ streams[k].push(...evs); });
  });
  if(tieRepeats){
    for(let k=0;k<3;k++){ streams[k] = tieMergeStream(streams[k]); }
  }

  // ②全音符1つ分の長さで小節に分割し直す（またがる長い音符は小節境界で分割する）
  const wholeNoteMs = durMs(9, tempo); // 9 = 全音符
  const cursors = [0,0,0];
  const remainders = [null,null,null]; // 前の小節からまたがってきた音符の残り
  const bars = [];
  let more = true;
  while(more){
    more = false;
    const bar = [[],[],[]];
    for(let k=0;k<3;k++){
      let acc = 0;
      // 残り物(remainder)も、新規に取り出すイベントとまったく同じ分割ロジックを通す。
      // タイ処理で1小節を超える長さの音符が生まれると、その残りがさらに1小節を超えることもあるため、
      // remainderを無条件で丸ごと詰め込むと、他パートが次の小節開始まで無音で待たされる不具合があった
      while(acc < wholeNoteMs - 0.01){
        let ev;
        if(remainders[k]){ ev = remainders[k]; remainders[k] = null; }
        else if(cursors[k] < streams[k].length){ ev = streams[k][cursors[k]]; cursors[k]++; }
        else break;
        if(acc + ev.ms > wholeNoteMs + 0.01){
          // 小節をまたぐ長い音符は分割し、残りは次の小節へ引き継ぐ（タイ）。
          // 残りがさらに1小節を超える場合は、次の小節でこのif文に再度入り重ねて分割される。
          // tieIn/tieOutで連鎖関係を記録し、後段でオシレーターを1本にまとめる（音の継ぎ目対策）
          const firstPart = wholeNoteMs - acc;
          const secondPart = ev.ms - firstPart;
          bar[k].push({freq:ev.freq, ms:firstPart, tieIn:!!ev.tieIn, tieOut:true});
          remainders[k] = {freq:ev.freq, ms:secondPart, tieIn:true};
          acc = wholeNoteMs;
        } else {
          bar[k].push({freq:ev.freq, ms:ev.ms, tieIn:!!ev.tieIn});
          acc += ev.ms;
        }
      }
      if(cursors[k] < streams[k].length || remainders[k]) more = true;
    }
    if(bar[0].length || bar[1].length || bar[2].length) bars.push(bar);
    else break;
  }
  const segEvents = bars;

  // 要望対応：小節をまたいで伸びる音符（タイ）は、これまで小節ごとに別々のオシレーターで
  // 再アタックしていたため境目に継ぎ目が聞こえていた。tieIn/tieOutの連鎖をたどって、
  // 連鎖の先頭イベントにだけ全体の長さ(audioMs)を持たせ、続き部分はオシレーターを作らない
  // (skipAudio)ようにすることで、1本の音として滑らかにつながるようにする
  for(let k=0;k<3;k++){
    let chainStart = null;
    for(let i=0;i<bars.length;i++){
      for(const ev of bars[i][k]){
        if(!ev.tieIn){
          if(ev.tieOut){ ev.audioMs = ev.ms; chainStart = ev; }
          else { chainStart = null; }
        } else {
          ev.skipAudio = true;
          if(chainStart) chainStart.audioMs += ev.ms;
          if(!ev.tieOut) chainStart = null;
        }
      }
    }
  }

  const master = actx.createGain(); master.gain.value=gainVal; master.connect(actx.destination);
  let stopped=false;

  // 小節1つ分だけスケジュールし、終了時刻を返す（実際の発音予約はここでしか行わない）
  function scheduleBar(barParts, startTime){
    let barEnd = startTime;
    barParts.forEach(events=>{
      let pt = startTime;
      events.forEach(ev=>{
        const d = ev.ms/1000;
        if(ev.freq>0 && !ev.skipAudio){
          // タイでつながる音符は、連鎖全体の長さ(audioMs)を使って1本のオシレーターで鳴らす
          const soundDur = (ev.audioMs!==undefined ? ev.audioMs : ev.ms)/1000;
          const osc=actx.createOscillator();
          osc.type='square';
          osc.frequency.value=ev.freq;
          const g=actx.createGain();
          g.gain.setValueAtTime(0.0001,pt);
          g.gain.linearRampToValueAtTime(1,pt+0.01);
          g.gain.setValueAtTime(1,Math.max(pt+0.01,pt+soundDur*0.75));
          g.gain.linearRampToValueAtTime(0.0001,pt+soundDur);
          osc.connect(g); g.connect(master);
          osc.start(pt); osc.stop(pt+soundDur+0.02);
        }
        pt += d;
      });
      barEnd = Math.max(barEnd, pt);
    });
    return barEnd;
  }

  // 小節単位の先読み方式：数秒分だけ・小節ごとに小さく予約する。
  // 曲全体や1周分を一括予約しない（GC/処理落ちの影響を抑えるため）。
  // どの小節で問題が起きたかも barIndex で追いやすい。
  const BUFFER_AHEAD_SEC = 3;
  let barIndex = 0;
  let nextBarStart = actx.currentTime + 0.05;
  let watchdog = null;
  function fillBars(){
    if(stopped) return;
    let guard = 0;
    while(nextBarStart < actx.currentTime + BUFFER_AHEAD_SEC && guard < 40){
      if(barIndex >= segEvents.length){
        if(!loop) return;
        barIndex = 0;
      }
      nextBarStart = scheduleBar(segEvents[barIndex], nextBarStart);
      barIndex++;
      guard++;
    }
  }

  fillBars();
  watchdog = setInterval(()=>{
    if(stopped){ clearInterval(watchdog); return; }
    fillBars();
  }, 400);
  return {
    stop(){
      stopped=true;
      if(watchdog) clearInterval(watchdog);
      try{ master.disconnect(); }catch(_){}
    }
  };
}

function buildVezarSegments(){
  const seg=[]; // 各要素は [p1str,p2str,p3str]（原曲のPLAY文1行分）
  const push=(a)=>{ seg.push([a[0],a[1],a[2]]); };
  for(let i=0;i<28;i++) push(V.P1);
  for(let i=0;i<2;i++) push(V.P2);
  for(let i=0;i<2;i++) push(V.P3);
  for(let i=0;i<8;i++) push(V.P1);
  for(let bIter=0; bIter<2; bIter++){
    let A=0;
    while(true){
      A++;
      push(V.Q1); push(V.Q2); push(V.Q3); push(V.Q3); push(V.Q1); push(V.Q6); push(V.Q7);
      if(A===2) break;
      push(V.Q7);
    }
    push(V.R1);
    push(V.S1); push(V.S2); push(V.S1); push(V.S4);
  }
  return seg;
}

let actx=null;

function ensureAudio(){
  if(!actx){
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; }
  }
  // iOS/iPadSafari対策：AudioContextはユーザー操作（タップ）の中でresumeしないと鳴らない
  if(actx && actx.state === 'suspended'){
    actx.resume().catch(()=>{});
  }
  // 無音バッファを1回再生して出力経路を確実に開通させる（iOS Safari向けの定番対策）
  if(actx && !actx.__unlocked){
    try{
      const b = actx.createBuffer(1,1,22050);
      const s = actx.createBufferSource();
      s.buffer=b; s.connect(actx.destination); s.start(0);
      actx.__unlocked = true;
    }catch(_){}
  }
}

   ============================================================ */
function noiseBurst(dur, f0, f1, gain){
  if(!actx) return;
  const n=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,n,actx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
  const src=actx.createBufferSource(); src.buffer=buf;
  const filt=actx.createBiquadFilter(); filt.type='bandpass';
  filt.frequency.setValueAtTime(f0,actx.currentTime);
  filt.frequency.linearRampToValueAtTime(f1,actx.currentTime+dur);
  const g=actx.createGain();
  g.gain.setValueAtTime(gain,actx.currentTime);
  g.gain.linearRampToValueAtTime(0.0001,actx.currentTime+dur);
  src.connect(filt); filt.connect(g); g.connect(actx.destination);
  src.start();
}
function beepTone(freq,dur,gain){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.setValueAtTime(freq,actx.currentTime);
  g.gain.setValueAtTime(gain,actx.currentTime);
  g.gain.linearRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
// 要望対応：ボス警告表示（2秒間）に合わせて鳴らす、ダライアス風の警告サイレン。
// 音階が上がって(RISE_MS)、その1.5倍の時間で下がる(FALL_MS)を1周期とし、これを3回繰り返す。
// 合計1800ms＝警告表示の2000msよりわずかに早く終わる。
// 要望対応：単音だと間抜けな印象だったため、1オクターブ低い声部を重ねて和音にした
function playBossWarningSiren(){
  if(!actx) return;
  const RISE_MS = 240, FALL_MS = 360, CYCLES = 3;
  const LOW = 440, HIGH = 880;
  const t0 = actx.currentTime;
  function voice(freqMul, gainVal){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square';
    let t = t0;
    o.frequency.setValueAtTime(LOW*freqMul, t);
    g.gain.setValueAtTime(gainVal, t);
    for(let i=0;i<CYCLES;i++){
      o.frequency.linearRampToValueAtTime(HIGH*freqMul, t + RISE_MS/1000);
      t += RISE_MS/1000;
      o.frequency.linearRampToValueAtTime(LOW*freqMul, t + FALL_MS/1000);
      t += FALL_MS/1000;
    }
    g.gain.setValueAtTime(gainVal, Math.max(t0, t-0.05));
    g.gain.linearRampToValueAtTime(0.0001, t);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t+0.02);
  }
  voice(0.5, 0.16);   // 要望対応：両パートとも1オクターブ低く（元は1）
  voice(0.25, 0.12);  // 要望対応：両パートとも1オクターブ低く（元は0.5、＝主旋律のさらに1オクターブ下）
}

  bigExplosion(){ noiseBurst(1.8,300,40,0.35); noiseBurst(2.7,150,20,0.3); }, // 要望対応：最終ボス撃破用の派手な爆音（不具合修正：持続時間を現行の3倍に）

// 不具合修正：ゲームで使うキーに対してpreventDefault()を呼んでおらず、ブラウザ本来の挙動

// 左右キーはスクロール先が無く何も起きないため、「上下だけ反応して左右は無反応」という
// 非対称な症状に見えていた。ゲームで使う全キーをここでまとめてpreventDefaultする
const GAME_KEY_CODES = new Set([

// 窓口を1つにまとめ、従来の登録順どおりに①〜④を呼ぶ（ブラウザは登録順に呼ぶため挙動は同一）。
// ※③→④のように、前段が状態を変えた結果を後段が見る依存関係が既にあるため、順序は変更しないこと
const keydownHandlers = [];
window.addEventListener('keydown', e=>{ for(const h of keydownHandlers) h(e); }, {passive:false});
const keyupHandlers = [];
window.addEventListener('keyup', e=>{ for(const h of keyupHandlers) h(e); });
// ①ゲームで使うキーのブラウザ既定動作（ページスクロール等）を打ち消す
// 不具合修正（Grok kcv73）：ランキング名入力中はpreventDefaultしない（A/S/D/W/Z/X等が入力できなくなる問題）
keydownHandlers.push(e=>{
  if(rankingFormActive) return;
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(GAME_KEY_CODES.has(e.code)) e.preventDefault();
});
function recomputeKeyDir(){
  let dx=0, dy=0;
  for(const code of keysHeld){ const v=MOVE_KEY_VECTORS[code]; if(v){ dx+=v[0]; dy+=v[1]; } }
  keyDir.x=dx; keyDir.y=dy;
  const wasHeld = keyHeld;
  keyHeld = (dx!==0 || dy!==0);
  if(keyHeld){ if(!wasHeld && !pointerHeld){ input.downTime = performance.now(); } input.active = true; }
  else if(!pointerHeld){ input.active = false; }
}

function handleBombPress(source){

// ゲームパッド対応（Gamepad APIはイベントが無いため、毎フレームpollGamepad()でポーリングする）
// A＝ショット、B＝ボム（緊急避難）、左スティック／十字キー＝移動（アナログ可）、
// L1/R1/L2/R2/L3/R3など、それらしいボタンはすべて低速移動として扱う、Start＝ポーズ、X/Yは予約（未使用）
const gpDir = {x:0, y:0}; // アナログの傾き量をそのまま保持（正規化しない）
let gpFireHeld = false;
let gpSlowHeld = false;
let gpPrevBombBtn = false;
let gpPrevStartBtn = false;
const GAMEPAD_DEADZONE = 0.2;
const GAMEPAD_SLOW_BUTTON_INDEXES = [4,5,6,7,10,11]; // L1,R1,L2,R2,L3,R3 相当
// 保険的な対応：gamepadconnected/disconnectedイベントも拾っておく（getGamepads()のポーリングだけでも
// 動作するはずだが、接続検知の取りこぼしを減らすため）。多くのブラウザはスティック操作だけでは
// ゲームパッドを認識せず、ボタンを一度押すまで情報を公開しない仕様（プライバシー対策）である点に注意
window.addEventListener('gamepadconnected', ()=>{});
window.addEventListener('gamepaddisconnected', ()=>{});
let gamepadBlocked = false; // Permissions-Policyでgamepad機能がブロックされている環境を検知したらtrueにし、以後呼ばない
function pollGamepad(){
  gpDir.x = 0; gpDir.y = 0; gpFireHeld = false; gpSlowHeld = false;
  if(gamepadBlocked || !navigator.getGamepads) return;
  let padsRaw;
  try{
    padsRaw = navigator.getGamepads();
  } catch(e){
    // 不具合修正：一部の環境（Permissions-Policyでgamepad機能が許可されていないホスティング等）では
    // navigator.getGamepads()がSecurityErrorを同期的に投げる。これを無防備に呼んでいたため、
    // 毎フレーム例外が発生してrequestAnimationFrame(frame)へ辿り着けず、フレームループ全体が
    // 実質的に止まっていた（ゲームパッドだけでなく、タッチ操作やキーボードが効かなくなる不具合の真因）
    gamepadBlocked = true;
    return;
  }
  let gp = null;
  for(let i=0;i<padsRaw.length;i++){ if(padsRaw[i]){ gp = padsRaw[i]; break; } }
  if(!gp) return;
  // 不具合修正：一部の非標準コントローラでgp.axesがnull/undefined/長さ0の場合TypeErrorになっていた。
  // これが「たまに変な動きになる」報告の真因候補。optional chainingで安全に取得する
  let ax = (gp.axes?.[0]) || 0, ay = (gp.axes?.[1]) || 0;
  if(Math.hypot(ax,ay) < GAMEPAD_DEADZONE){ ax=0; ay=0; }
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const startNow = btn(9);
  if(startNow && !gpPrevStartBtn && (state==='playing') && !demoActive){ togglePause(); }
  gpPrevStartBtn = startNow;
  if(paused) return; // ポーズ中はStartボタンの解除判定以外はすべて無視
  if(btn(14)) ax = -1; if(btn(15)) ax = 1; // 十字キー左右（デジタル、標準マッピング）
  if(btn(12)) ay = -1; if(btn(13)) ay = 1; // 十字キー上下
  gpDir.x = Math.max(-1,Math.min(1,ax)); gpDir.y = Math.max(-1,Math.min(1,ay));
  if(state==='playing' && !demoActive){
    gpFireHeld = btn(0); // Aボタン
    gpSlowHeld = GAMEPAD_SLOW_BUTTON_INDEXES.some(i=>btn(i));
    const bombNow = btn(1); // Bボタン
    if(bombNow && !gpPrevBombBtn){ handleBombPress('gp'); }
    gpPrevBombBtn = bombNow;
  }
}

// 不具合修正：keyDirを計算するだけで実際の移動目標(input.x/y)へ反映する処理が無く、
// キー入力そのものでは自機が動かなかった。押し続けている間、自機の少し先に目標点を
// 置き続けることで移動させる（毎フレーム呼び出す）。ゲームパッドのアナログスティックも
// ここに統合し、傾き量（0〜1）に応じて速度を落とす
// ↓↓↓ 要望対応：後々の調整用に、キーボード/ゲームパッド移動の速度・先読み距離をここにまとめておく ↓↓↓
const KEY_MOVE_LOOKAHEAD = 1; // 目標点を自機の何マス先に置くか（大きいほど、離した瞬間のオーバーシュートが大きくなる）
const KEY_MOVE_SPEED_CELLS_PER_30FPS = 0.5; // キーボード/ゲームパッド移動の最高速度（タッチ/マウスは別途2.0で固定）
const SLOW_MOVE_SCALE = 0.5; // Shift/低速ボタン押下中の速度倍率
// ↑↑↑ ここまで ↑↑↑
let usingDirectionalMove = false; // updatePlayerMovement側で速度計算に使う
let directionalAnalogMag = 1;     // ゲームパッドの傾き量（0〜1）。キーボードは常に1
function updateDirectionalMovement(){
  usingDirectionalMove = false;
  if(pointerHeld || demoActive) return; // マウス/タッチ操作中はそちらを優先。デモ中はキーボード/ゲームパッドの入力を完全に無視する
  // （ゲームパッド接続時、スティックのドリフトがデッドゾーンを超えているとデモのAI操作を
  // 上書きしてしまい、片方向にしか動かなくなる不具合があった）
  const dx = keyDir.x + gpDir.x, dy = keyDir.y + gpDir.y;
  const rawMag = Math.hypot(dx,dy);
  if(rawMag < 0.05){
    // 不具合修正：スティック/キーがニュートラルに戻った際、input.activeをfalseに戻さず
    // 直前の古い目標座標が残ったままだった。次フレームでusingDirectionalMoveがfalseになる一方
    // 目標座標は残っていたため、タッチ操作用の上方向オフセット（1.2マス）が誤って適用され、
    // 停止直後に自機が一瞬だけ上にずれて見える不具合の原因になっていた
    input.active = false;
    return;
  }
  directionalAnalogMag = Math.min(1, rawMag);
  const nx = dx/rawMag, ny = dy/rawMag;
  input.x = player.x + nx*KEY_MOVE_LOOKAHEAD;
  input.y = player.y + ny*KEY_MOVE_LOOKAHEAD;
  input.active = true;
  usingDirectionalMove = true;
}

let dodgeFreeMode = false; // デバッグ用：コナミコマンドで解禁、回数制限フリー・常時3回クリック
let invincibleMode = false; // 隠しモード：著作権表記24回連続タップで解禁、被弾判定を完全無効化
function dodgeRequiredTaps(){
  if(dodgeFreeMode) return 3;
  const idx = Math.min(dodgeUsesUsed, DODGE_UNIT_SEQUENCE.length-1);
  return DODGE_UNIT_SEQUENCE[idx] * DODGE_UNIT_TAPS;
}
function toGrid(cx,cy){ return {gx:(cx-(W-cols*cell)/2)/cell, gy:(cy-(H-rows*cell)/2)/cell}; }
const SECRET_TAP_REQUIRED = 16;
let secretTapCount = 0;
let secretTapLastTime = 0;
const INVINCIBLE_TAP_REQUIRED = 24;
let invincibleTapCount = 0;
let invincibleTapLastTime = 0;
function interruptAttractMode(){
  // アトラクトループ中は、どの画面でも操作があった瞬間に中断し、操作可能な本物の題名へ戻す
  attractMode = false; demoActive = false; attractPhase = 'title'; attractPhaseTimer = 0;
  hideAttractRanking();
  enterTitle();
}
function pointerDown(cx,cy){
  ensureAudio();
  idleTimer = 0; // 何らかの操作があったら無操作タイマーをリセット
  if(attractMode){
    interruptAttractMode();
    return; // このタップ自体はゲーム開始などには使わない
  }
  // 要望対応：ポーズ中はポーズボタンの再タップ（解除）以外は無視する
  if(paused){
    if(isPauseButtonHit(cx,cy)) togglePause();
    return;
  }
  // 要望対応：プレイ中、画面下部の帯は「移動に使わない領域」。ポーズ／連射トグルボタンのタップのみ受け付ける
  if(state==='playing' && !demoActive && cy >= H*BOTTOM_UI_ZONE_START){
    if(isPauseButtonHit(cx,cy)) togglePause();
    else if(isFireToggleButtonHit(cx,cy)) toggleTouchAutoFire();
    return;
  }
  pointerHeld=true; input.active=true; input.downTime=performance.now();
  const p=toGrid(cx,cy); input.x=p.gx; input.y=p.gy;
  const now=performance.now();
  if(now-input.lastTapTime<350) input.tapCount++; else input.tapCount=1;
  input.lastTapTime=now;
  if(input.tapCount>=dodgeRequiredTaps()){ input.dodgeRequested=true; input.tapCount=0; }
  if(state==='title'){
    if(titleDeciding) return; // 要望対応：決定演出中の多重タップを無視
    // タッチ端末向けの隠しコマンド代替：著作権表記を16回連続タップ
    const copyrightHit = cy > H*0.8 && cy < H*1.0 && cx > W*0.1 && cx < W*0.9;
    if(copyrightHit){
      if(now-secretTapLastTime<900) secretTapCount++; else secretTapCount=1;
      secretTapLastTime = now;
      if(secretTapCount>=SECRET_TAP_REQUIRED){ dodgeFreeMode = true; secretTapCount = 0; }
      // 無敵モード：16回タップ判定とは完全独立のカウンター（別変数・別タイマー）
      if(now-invincibleTapLastTime<900) invincibleTapCount++; else invincibleTapCount=1;
      invincibleTapLastTime = now;
      if(invincibleTapCount>=INVINCIBLE_TAP_REQUIRED){ invincibleMode = true; invincibleTapCount = 0; }
      return; // ゲーム開始はしない
    }
    // 要望対応：別の選択肢をタップしたら選択が移動するだけ（開始しない）。
    // 同じ選択肢をもう一度タップしたら決定（光って点滅＋矩形波SFX→開始）。
    // ボタン領域外のタップは、初回は選択確定のみ、2回目以降は現在の選択で決定
    const onTimeattackBtn = cy > H*0.585 && cy < H*0.665 && cx > W*0.06 && cx < W*0.48;
    const onUnlimitedBtn  = cy > H*0.585 && cy < H*0.665 && cx > W*0.52 && cx < W*0.94;
    if(onTimeattackBtn || onUnlimitedBtn){
      const tappedMode = onTimeattackBtn ? 'timeattack' : 'unlimited';
      if(titleModeConfirmed && tappedMode===gameMode){ confirmTitleModeAndStart(); return; }
      gameMode = tappedMode;
      titleModeConfirmed = true;
      return;
    }
    if(titleModeConfirmed){ confirmTitleModeAndStart(); return; }
    titleModeConfirmed = true; // モード領域外の初回タップは、現在のモードのまま選択確定のみ
    return;
  }
  else if(state==='result'){
    if(resultReason==='clear'){ startStaffRoll(); }
    else { stopSong(); enterTitle(); }
  }
  else if(state==='staffroll'){ if(!rankingFormActive && hasSeenStaffRoll()){ finishStaffRollFlow(); } }
  else if(state==='opening'){ if(hasSeenOpening()){ enterTitle(); } }
}

// 要望対応：二本指同時操作に対応（片方で移動、片方で連射トグルなど）。
// 移動を担当するタッチのidentifierだけを覚えておき、それ以外の新規タッチは
// 画面下部の非移動領域なら個別にUI操作として処理する（移動トラッキングとは独立）
let moveTouchId = null;
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(state==='playing' && !demoActive && t.clientY >= H*BOTTOM_UI_ZONE_START){
      if(isPauseButtonHit(t.clientX,t.clientY)) togglePause();
      else if(isFireToggleButtonHit(t.clientX,t.clientY)) toggleTouchAutoFire();
      continue; // このタッチは移動用にはしない
    }
    if(moveTouchId===null){
      moveTouchId = t.identifier;
      pointerDown(t.clientX, t.clientY);
    }
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveTouchId) pointerMove(t.clientX, t.clientY);
  }
},{passive:false});
function endMoveTouchIfMatches(e){
  for(const t of e.changedTouches){
    if(t.identifier===moveTouchId){ moveTouchId=null; pointerUp(); }
  }
}
canvas.addEventListener('touchend', e=>{ e.preventDefault(); endMoveTouchIfMatches(e); },{passive:false});
canvas.addEventListener('touchcancel', e=>{ e.preventDefault(); endMoveTouchIfMatches(e); },{passive:false});
canvas.addEventListener('mousedown',e=>pointerDown(e.clientX,e.clientY));
canvas.addEventListener('mousemove',e=>pointerMove(e.clientX,e.clientY));
canvas.addEventListener('mouseup',()=>pointerUp());

// 要望対応：タイトル画面のキーボード操作。左右（矢印／A・D）でモード選択をトグル、
// それ以外のキーでそのモードのままゲーム開始。ただしコナミコマンド（上上下下左右左右BA）の
// 入力を優先する：次に期待されるコナミキーと一致する場合はコマンド入力として消費し、
// モード切替にもスタートにも使わない（要望対応：上下キー単体でのスタートより優先）
const TITLE_LEFT_KEYS = new Set(['ArrowLeft','KeyA']);
const TITLE_RIGHT_KEYS = new Set(['ArrowRight','KeyD']);
const KONAMI_SEQUENCE = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];
let konamiProgress = 0;
// ⑤題名画面のモード選択・コナミコマンド
keydownHandlers.push(e=>{
  // 不具合修正：②で画面を送った直後の同一イベントでは反応しない（題名に留まる）
  if(e.__kcConsumed){ konamiProgress = 0; return; }
  if(rankingFormActive) return; // 不具合修正（Grok kcv73）
  if(ANYKEY_EXCLUDE.has(e.code)) return; // スクショキーで誤起動しないよう除外
  if(state!=='title'){ konamiProgress = 0; return; }
  if(attractMode) return;
  if(titleDeciding) return; // 要望対応：決定演出中の多重入力を無視

  if(e.code === KONAMI_SEQUENCE[konamiProgress]){
    konamiProgress++;
    if(konamiProgress>=KONAMI_SEQUENCE.length){
      dodgeFreeMode = true;
      konamiProgress = 0;
    }
    return; // コナミ入力として消費（モード切替・スタートには使わない）
  }
  konamiProgress = (e.code===KONAMI_SEQUENCE[0]) ? 1 : 0;

  if(TITLE_LEFT_KEYS.has(e.code) || TITLE_RIGHT_KEYS.has(e.code)){
    gameMode = (gameMode==='timeattack') ? 'unlimited' : 'timeattack'; // 選択肢は2つなのでどちらのキーでもトグルでよい
    return;
  }
  ensureAudio();
  confirmTitleModeAndStart();
});

// ============ Matrix rain / ワープ演出 ============
// ステージ3突入時：3秒のワープ演出（中心から放射状に射出） → Matrixデジタルレイン
// Matrix文字プール：半角カタカナのみ（漢字は敵文字と誤認されるため除外）
const MATRIX_RAIN_CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
function _rmc(){ return MATRIX_RAIN_CHARS[Math.floor(Math.random()*MATRIX_RAIN_CHARS.length)]; }

let matrixStreams = [];
function _makeStream(px, charPx, randomY){
  const len = 6 + Math.floor(Math.random()*16);     // ストリームの長さ（文字数）
  const spd = (1.8 + Math.random()*5.5) * charPx;   // pixel/sec
  const hy  = randomY ? Math.random()*(H + len*charPx) - len*charPx
                      : -(len*charPx + Math.random()*H*0.4);
  return { px, charPx, hy, spd, len,
           chars: Array.from({length:len}, _rmc),
           cTimer: 60 + Math.random()*120 }; // 文字変化タイマー(ms)
}
function initMatrixStreams(){
  matrixStreams = [];
  const cw = Math.max(8, cell * 0.82);              // 1カラムの幅（px）
  const n  = Math.ceil(W / cw) + 1;
  for(let i=0; i<n; i++) matrixStreams.push(_makeStream(i*cw + cw*0.5, cw, true));
}
function updateMatrixStreams(dt){
  matrixStreams.forEach(s=>{
    s.hy += s.spd * dt/1000;
    s.cTimer -= dt;
    if(s.cTimer <= 0){
      s.chars[Math.floor(Math.random()*s.len)] = _rmc();
      s.cTimer = 50 + Math.random()*110;
    }
    if(s.hy - s.len*s.charPx > H + s.charPx){
      // 画面外へ抜けたらリセット（上端外から再スタート）
      s.len = 6 + Math.floor(Math.random()*16);
      s.spd = (1.8 + Math.random()*5.5) * s.charPx;
      s.hy  = -(s.len*s.charPx) - Math.random()*H*0.5;
      s.chars = Array.from({length:s.len}, _rmc);
    }
  });
}
function drawMatrixStreams(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs = Math.max(8, cell * 0.8);
  ctx.font = `${fs}px monospace`;
  matrixStreams.forEach(s=>{
    for(let i=0; i<s.len; i++){
      const py = s.hy - i*s.charPx;
      if(py < -s.charPx || py > H + s.charPx) continue;
      let alpha, color;
      if(i === 0){         color='#e0ffe0'; alpha=1.0; }                           // 先頭：白みがかった明るい緑
      else if(i <= 2){     color='#00ff41'; alpha=1.0 - i*0.08; }                 // 直後：明るい緑
      else {               color='#00cc33'; alpha=Math.max(0.05, 0.85 - (i/s.len)*0.85); } // トレイル：暗い緑へ減衰
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillText(s.chars[i], s.px, py);
    }
  });
  ctx.globalAlpha=1; ctx.restore();
}

// ワープ演出（ステージ3突入時：奥から手前に星が展開）
let warpActive = false;
let warpTimer  = 0;
const WARP_DURATION_MS = 3000;
let warpParticles = [];
function startWarpEffect(){
  warpActive = true;
  warpTimer  = 0;
  warpParticles = [];
  const N = 100;
  for(let i=0; i<N; i++){
    const angle = (i/N)*Math.PI*2 + (Math.random()-0.5)*0.25;
    warpParticles.push({
      angle,
      dist : Math.random()*0.3,             // 中心からの距離（cell単位）
      spd  : 0.4 + Math.random()*1.8,      // cell/sec（加速前の基礎速度）
      white: Math.random()<0.12,            // 一部を白くして光ファイバー感
      width: 0.8 + Math.random()*1.5
    });
  }
}
function updateWarp(dt){
  warpTimer += dt;
  const progress = Math.min(1, warpTimer / WARP_DURATION_MS);
  const accel = 1 + progress*progress*18;  // 指数的加速
  warpParticles.forEach(p=>{ p.dist += p.spd * accel * dt/1000; });
  if(warpTimer >= WARP_DURATION_MS){
    warpActive = false;
    initMatrixStreams();  // ワープ完了 → Matrixレイン開始
  }
}
function drawWarp(){
  ctx.save();
  const cx = W/2, cy = H/2;
  const progress = Math.min(1, warpTimer / WARP_DURATION_MS);
  // 徐々に画面が明るくなる白フラッシュ（終盤だけ）
  if(progress > 0.7){
    ctx.fillStyle = `rgba(0,255,65,${(progress-0.7)*0.18})`;
    ctx.fillRect(0, 0, W, H);
  }
  warpParticles.forEach(p=>{
    const trailLen = p.spd * (0.5 + progress*4) * cell; // 加速につれてトレイルが伸びる
    const x1 = cx + Math.cos(p.angle) * p.dist * cell;
    const y1 = cy + Math.sin(p.angle) * p.dist * cell;
    const x0 = cx + Math.cos(p.angle) * Math.max(0, p.dist*cell - trailLen);
    const y0 = cy + Math.sin(p.angle) * Math.max(0, p.dist*cell - trailLen);
    const alpha = Math.min(1, 0.3 + progress*0.7);
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    const col = p.white ? `rgba(255,255,255,${alpha})` : `rgba(0,255,65,${alpha})`;
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, col);
    ctx.strokeStyle = g;
    ctx.lineWidth = p.width;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  });
  ctx.restore();
}

const ROW_COLOR_PALETTE = ['#5be0ff','#c866ff','#ffd23b','#ff4d5e','#66ff9c','#ff8a3b'];
function colorForRow(slotY){
  const idx = Math.round(Math.abs(slotY||0));
  return ROW_COLOR_PALETTE[idx % ROW_COLOR_PALETTE.length];
}

// 通常敵と固定文字敵（フレーズ編隊）は、耐久＝画数÷2という基本部分が共通だったため生成処理を一本化する。
// 違いは色・突入までの待ち時間・文字サイズを揃えるかどうかだけなので、それらをextraで上書きする
// 突入までの待ち時間は「基準値＋乱数幅」で指定する。乱数の消費順を原版と揃えるため、
// fireTimerを先に決めてからdiveDelayを決める（生成される敵の並びが変わらないようにするため）
function makeEnemy(ch, strokes, slotX, slotY, color, diveBase, diveRange, extra){
  const hp = Math.max(1, Math.ceil(strokes/2));
  const fireTimer = 800+Math.random()*2000;
  const diveDelay = diveBase+Math.random()*diveRange;
  return Object.assign({
    ch, strokes, hp, maxHp:hp, slotX, slotY, x:0, y:-2, vx:0, vy:0,
    hitFlash:0, fireTimer, color,
    pattern:'march', diveT:0, diveState:'hover', diveDelay, loopT:0
  }, extra);
}
function makeEnemyBase(slotX, slotY, tier){
  const pick = pickFromTier(tier); // tier未指定時はpickFromTier内部でREGULAR_POOL全体から選ぶ
  return makeEnemy(pick[0], pick[1], slotX, slotY, colorForRow(slotY), 800, 2500);
}
function makeEnemyFixed(ch, strokes, slotX, slotY){
  return makeEnemy(ch, strokes, slotX, slotY, '#ffcf6a', 1500, 2500, { uniformSize:true });
}

let stage0WaveInitialCount = 60;
function spawnStage0Wave(){
  // 第一形態：階層編隊（下段=弱、中段=中、上段=強）、横移動→降下
  const colsN = 10, spacing = 1.25;
  const rowsDef = [
    {row:0, tier:TIER_STRONG},
    {row:1, tier:TIER_STRONG},
    {row:2, tier:TIER_MEDIUM},
    {row:3, tier:TIER_MEDIUM},
    {row:4, tier:TIER_WEAK},
    {row:5, tier:TIER_WEAK}
  ];
  rowsDef.forEach(rd=>{
    for(let c=0;c<colsN;c++){
      const e = makeEnemyBase((c-(colsN-1)/2)*spacing, rd.row*1.0, rd.tier);
      e.pattern='march';
      enemies.push(e);
    }
  });
  stage0WaveInitialCount = enemies.filter(e=>e.pattern==='march').length;
}

let usedPhrasesThisRun = new Set(); // 要望対応：1プレイ内で既出のフレーズは記録し、再度出さないようにする
function pickUnusedPhrase(excludeText){
  let avail = PHRASE_POOL.filter(p=>!usedPhrasesThisRun.has(p.text) && p.text!==excludeText);
  if(avail.length===0){
    // 枯渇したら（全フレーズ使い切った等）、直近のexcludeTextとの重複だけは避けつつ全体から選び直す
    avail = PHRASE_POOL.filter(p=>p.text!==excludeText);
  }
  return avail[Math.floor(Math.random()*avail.length)];
}
function spawnStage3PhraseFormation(){
  // 2つの異なるフレーズを選択（既出のものは除外する）。元の仕様通り、未使用ならPHRASE_POOL[0]を70%優先
  let phrase1;
  if(!usedPhrasesThisRun.has(PHRASE_POOL[0].text) && Math.random()<0.7){ phrase1 = PHRASE_POOL[0]; }
  else { phrase1 = pickUnusedPhrase(null); }
  let phrase2 = pickUnusedPhrase(phrase1.text);

  // 連続文字チェック（1フレーズ内の隣接同字）
  let attempts = 0;
  while(hasConsecutiveSameChars(phrase1.text) && attempts < 20){
    phrase1 = pickUnusedPhrase(null);
    attempts++;
  }
  // フレーズ2は「自身の隣接同字」に加え「フレーズ1との文字重複」も無いものを選び直す
  attempts = 0;
  while((hasConsecutiveSameChars(phrase2.text) || sharesAnyChar(phrase1.text, phrase2.text)) && attempts < 30){
    phrase2 = pickUnusedPhrase(phrase1.text);
    attempts++;
  }
  usedPhrasesThisRun.add(phrase1.text);
  usedPhrasesThisRun.add(phrase2.text);

  // === 16文字編隊（8文字×2行、2フレーズ結合）===
  const colsN = 8, spacing = 1.15;
  const fullText = phrase1.text + phrase2.text;  // 16文字結合
  const fullStrokes = phrase1.strokes.concat(phrase2.strokes);

  for(let i = 0; i < 16; i++){
    const r = Math.floor(i / colsN);
    const c = i % colsN;
    const slotX = (c - (colsN-1)/2) * spacing;
    const slotY = r * 1.8;

    const e = makeEnemyFixed(fullText[i], fullStrokes[i], slotX, slotY);
    e.pattern = 'incoming';
    e.incomingT = 0;
    e.fromSide = (i % 2 === 0) ? -1 : 1;
    e.x = e.fromSide < 0 ? -3 : cols + 3;
    e.y = 1.5 + r * 1.8 + (Math.random() - 0.5) * 1.5;
    enemies.push(e);
  }
}
function hasConsecutiveSameChars(str){
  for(let i=1; i<str.length; i++){
    if(str[i] === str[i-1]) return true;
  }
  return false;
}
function sharesAnyChar(a, b){
  const setA = new Set(a.split(''));
  for(const ch of b){ if(setA.has(ch)) return true; }
  return false;
}

function setupFormationForStage(){
  enemies = [];
  formation.anchorX = cols/2; formation.anchorY = 2; formation.dir = 1;
  stageWave = 0;
  if(stageIndex===0){

  } else if(stageIndex===1){
    // 第二形態：編隊は降下しない。個々（または複数同時）が急降下→
    // 画面下から出たら上に戻る（ラップアラウンド）、たまに宙返りで戻る。
    // 同時攻撃数の上限：ギャラクシアン＝4体
    const colsN = 10, rowsN=5, spacing=1.15; // 要望対応：3列→5列に増加
    for(let r=0;r<rowsN;r++) for(let c=0;c<colsN;c++){
      const tier = r===0?TIER_MEDIUM:TIER_WEAK;
      const e = makeEnemyBase((c-(colsN-1)/2)*spacing, r*1.1, tier);
      e.pattern='peel';

    // ＋周辺にステージ1と同等の数まで通常の護衛敵を配置（フレーズの可読性は保つ）
    spawnStage3PhraseFormation();
    const fillerNeeded = 30 - enemies.length;
    for(let i=0;i<fillerNeeded;i++){
      const col = i%10, row = 2 + Math.floor(i/10);
      const e = makeEnemyBase((col-4.5)*1.15, row*1.1, TIER_WEAK);
      e.pattern='peel';
      e.x = formation.anchorX + e.slotX; e.y = -1 - row;
      enemies.push(e);
    }
  }
  // ステージ開始からの攻撃猶予（第三形態は編隊の整列完了後に開始）
  if(stageIndex===2){
    stageGraceActive = false; graceWaitingForAssembly = true;
  } else {
    stageGraceActive = true; stageGraceTimer = 2000; graceWaitingForAssembly = false;
  }
}

const MAX_DIVERS = [0,4,2]; // ステージごとの同時攻撃数上限（第三形態はフレーズの可読性を保つため少なめ）

// 最適化：countDiving()は元々enemies全体をO(n)スキャンするため、
// enemies.forEach内で呼ぶとO(n²)になっていた。
// → updateEnemies先頭で1度だけ再計算し、以後はカウンタを参照するだけ（hover→diving時にインクリメント）
let _divingCount = 0;
function countDiving(){ return _divingCount; }

function updateFormationEnemy(e, dt){
  e.prevX = e.x; e.prevY = e.y; // 斜め移動時の向き判定用
  if(e.pattern==='march'){
    e.x = formation.anchorX + e.slotX;
    e.y = formation.anchorY + e.slotY;
  } else if(e.pattern==='approach'){
    e.wobblePhase += dt/500;
    e.x += (e.vx + Math.sin(e.wobblePhase)*0.6) * dt/1000;
    e.y += e.vy * dt/1000;
    e.x = Math.max(0.5, Math.min(cols-0.5, e.x));
  } else if(e.pattern==='advFormation'){
    e.advT += dt;
    e.x = e.advBaseX + e.slotX + Math.cos(e.advT*e.advFreq + e.advPhase)*e.advAmp;
    e.y += 2.0*dt/1000 + Math.sin(e.advT*e.advFreq*1.6)*0.0015*dt;
  } else if(e.pattern==='incoming'){
    e.incomingT += dt/1800;
    const t = Math.min(1, e.incomingT);
    const targetX = formation.anchorX + e.slotX, targetY = formation.anchorY + e.slotY;
    const startX = e.fromSide<0 ? -2 : cols+2;
    // イーズアウトしつつ、cos/sinで弧を描きながら目標スロットへ収束
    const ease = 1 - Math.pow(1-t, 3);
    e.x = startX + (targetX-startX)*ease + Math.sin(t*Math.PI*3)*(1-t)*2.0*e.fromSide*-1;
    e.y = targetY + Math.cos(t*Math.PI*2)*(1-t)*1.5;
    if(t>=1){
      e.pattern='peel'; e.diveState='hover'; e.diveDelay=1200+Math.random()*2500;
      e.x = targetX; e.y = targetY;
    }
  } else if(e.pattern==='peel'){
    if(e.diveState==='hover'){
      e.x = formation.anchorX + e.slotX;
      e.y = formation.anchorY + e.slotY;
      e.diveDelay -= dt;
      const cap = MAX_DIVERS[stageIndex]||3;
      if(e.diveDelay<=0 && countDiving()<cap){
        e.diveState='diving'; e.diveT=0;
        _divingCount++; // 同フレーム内の後続敵がcapを正しく参照できるようインクリメント
      }
    } else if(e.diveState==='diving'){
      e.diveT += dt/2200;
      const depth = rows - (formation.anchorY+e.slotY) - 1.5;
      e.x = formation.anchorX + e.slotX + Math.sin(e.diveT*Math.PI*2)*2.0;
      e.y = formation.anchorY + e.slotY + e.diveT*Math.max(2,depth);
      if(e.diveT>=1){
        // 画面下に抜けた：通常は上から戻る、たまに宙返りで戻る
        if(Math.random()<0.3){ e.diveState='loop'; e.loopT=0; }
        else { e.diveState='returning'; e.y=-1.2; e.x=formation.anchorX+e.slotX; }
      }
    } else if(e.diveState==='returning'){
      // 上から瞬時に戻り、編隊位置へ滑らかに復帰
      e.diveDelay -= dt;
      const ty = formation.anchorY+e.slotY;
      e.y += (ty-e.y)*Math.min(1,dt/300);
      e.x += (formation.anchorX+e.slotX-e.x)*Math.min(1,dt/300);
      if(Math.abs(e.y-ty)<0.05){ e.diveState='hover'; e.diveDelay=800+Math.random()*2500; }
    } else if(e.diveState==='loop'){
      // 宙返り：画面下から円弧を描いて上まで戻る
      e.loopT += dt/1600;
      const cx = formation.anchorX + e.slotX;
      const topY = -1.2, botY = rows+1.2;
      const ang = e.loopT*Math.PI; // 0→π
      e.y = botY - (botY-topY)*e.loopT;
      e.x = cx + Math.sin(ang)*3.0;
      if(e.loopT>=1){ e.diveState='returning'; e.y=-1.2; e.x=cx; }
    }
  }
  // 向きの回転をなめらかに補間（斜め移動→正面停止時に瞬時スナップしていた不具合の修正）
  // 宙返り中（diveState==='loop'）は既存のloopT連続回転をそのまま使うので対象外
  if(e.diveState!=='loop'){
    const dx = e.x-e.prevX, dy = e.y-e.prevY;
    let target = 0; // 直進・停止中は正面（無回転）
    if(Math.hypot(dx,dy) > 0.01 && Math.abs(dx)>0.01 && Math.abs(dy)>0.01){
      target = Math.atan2(dy,dx)+Math.PI/2;
    }
    if(e.rotAngle===undefined) e.rotAngle = target; // 初回は即時反映（出現時の不要な回転を防ぐ）
    let diff = target - e.rotAngle;
    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    e.rotAngle += diff * Math.min(1, dt/220); // 約220msで追従、正面へもなめらかに戻る
  }
}

function updateFormationAnchor(dt){
  if(stageIndex===0){
    const marchers = enemies.filter(e=>e.pattern==='march');
    let leftBound = cols/2-4, rightBound = cols/2+4;
    if(marchers.length>0){
      const minSlotX = Math.min(...marchers.map(e=>e.slotX));
      const maxSlotX = Math.max(...marchers.map(e=>e.slotX));
      leftBound = Math.max(1 - minSlotX, 1);
      rightBound = Math.min(cols-1 - maxSlotX, cols-1);
      if(leftBound>rightBound){ const m=(leftBound+rightBound)/2; leftBound=m; rightBound=m; }
      // 残存編隊が密集すると移動範囲が極端に狭くなり、降下（stepDown）が暴走するのを防ぐため最低移動幅を確保
      const MIN_SPAN = 4;
      if(rightBound-leftBound < MIN_SPAN){
        const c = (leftBound+rightBound)/2;
        leftBound = Math.max(1, c-MIN_SPAN/2);
        rightBound = Math.min(cols-1, c+MIN_SPAN/2);
      }
    }
    // インベーダー仕様：残数が減るほど加速する（撃破ごとに線形加速し、残り1体で最速＝初速の8倍。要望対応で体感できるレベルに強化）
    const STAGE1_MAX_SPEED_MUL = 32; // 要望対応：さらに2倍に強化（16倍→32倍）
    const totalForRamp = Math.max(1, stage0WaveInitialCount - 1);
    const kills = stage0WaveInitialCount - marchers.length;
    const speedMul = 1 + (STAGE1_MAX_SPEED_MUL - 1) * Math.min(1, kills / totalForRamp);
    // 本家インベーダー演出：敵スピード段階が上がったらBGMテンポも上げる（デモ中は鳴らさない）
    if(!demoActive){
      const lv = stage1SpeedLevel(speedMul);
      if(lv > stage1MusicLv && stage1MusicLv >= 0){ playStage1(lv); } // 加速方向のみ（段階が戻ってもテンポは下げない）
    }
    formation.anchorX += formation.dir * dt/1000*0.275*speedMul; // 基礎速度は1/2のまま、加速倍率のみ強化（要望対応）
    if(formation.anchorX > rightBound || formation.anchorX < leftBound){
      formation.dir *= -1;
      formation.anchorX = Math.max(leftBound, Math.min(rightBound, formation.anchorX));
      // 降下しきったら、そこから先は同じ高さで横移動のみ継続する（強制ゲームオーバーにはしない）
      const MAX_FORMATION_ANCHOR_Y = rows - 8;
      formation.anchorY = Math.min(formation.anchorY + formation.stepDown, MAX_FORMATION_ANCHOR_Y);
    }
  } else if(stageIndex===1){
    formation.anchorX = cols/2 + Math.sin(elapsed/1800)*3;
    formation.anchorY = 2 + Math.sin(elapsed/2600)*0.6;
  } else if(stageIndex===2){
    formation.anchorX = cols/2 + Math.sin(elapsed/1400)*3.6 + Math.cos(elapsed/2100)*1.2;
    formation.anchorY = 2 + Math.cos(elapsed/2000)*0.5;
  }
}

// 弾色の既定値と「自機方向の単位ベクトル」の算出が各発射関数で重複していたため切り出す
function bulletColor(e){ return e.color || '#ff3b3b'; }
function aimAtPlayer(e){
  const dx = player.x-e.x, dy = player.y-e.y, d = Math.hypot(dx,dy) || 1;
  return { nx: dx/d, ny: dy/d };
}
function fireEnemyBullet(e, count){
  count = count || 1;
  const color = bulletColor(e);
  for(let i = 0; i < count; i++){
    const spread = count > 1 ? (i - (count-1)/2) * 0.35 : 0;
    eBullets.push({
      x: e.x,
      y: e.y + 0.5,
      vx: spread,
      vy: 5.5,
      color: color,
      isNormalBullet: (e === bossActive) ? false : true
    });
  }
}
function fireRadialBullets(e,n,speed,angleOffset){
  const color = bulletColor(e);
  for(let i=0;i<n;i++){
    const ang = (angleOffset||0) + (i/n)*Math.PI*2;
    eBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,color});
  }
}
function fireAimedBullet(e,speed){
  const a = aimAtPlayer(e);
  eBullets.push({x:e.x,y:e.y,vx:a.nx*speed,vy:a.ny*speed,color:bulletColor(e)});
}
function fireHomingBullets(e,n,speed){
  n = Math.min(n,2); // 要望対応：追尾弾は強すぎたため2発までに削減
  const color = bulletColor(e);
  const a = aimAtPlayer(e);
  for(let i=0;i<n;i++){
    const spread = n>1 ? (i-(n-1)/2)*0.5 : 0;
    const baseVx=a.nx*speed, baseVy=a.ny*speed;
    // 初速に少し扇状のばらつきを持たせつつ、以降updateEnemyBullets側で自機方向へ旋回させる
    const cos=Math.cos(spread), sin=Math.sin(spread);
    eBullets.push({
      x:e.x, y:e.y,
      vx: baseVx*cos - baseVy*sin,
      vy: baseVx*sin + baseVy*cos,
      color, homing:true, homingTurnsLeft:3, homingReaimTimer:500 // 要望対応：3回だけ追尾し、以降は直進して画面外へ
    });
  }
}

   弾・パーティクル・クリア演出

function addPopup(x,y,text,color){ popups.push({x,y,text,color,life:700,t:0}); }
// 通常の被弾用と、最終ボス爆散用の特大バーストは飛散速度と寿命が違うだけだったため引数で一本化した。
// spread=飛散速度の倍率、lifeScale=寿命の倍率（最終ボスは画面外まで届くよう大きくする）
function addParticles(x,y,n,color,spread,lifeScale){

  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*sp,vy:(Math.random()-0.5)*sp,life:(300+Math.random()*300)*ls,t:0,ch:(Math.random()<0.5?'炎':'火'),color});
}

function addBigExplosionParticles(x,y,n,color){ addParticles(x,y,n,color,28,3); }

// 要望対応：最終ボス撃破後のクリア演出。全128種の漢字を8列×8匹の縦編隊×2回（合計128匹）で
// 画面下からsin/cosの動きで上へ流し、上に近づくほど彩色→白へ変化させる。演出中、敵編隊は
// 弾を吐かない（そもそも通常の敵配列とは別管理にして無害化している）
let celebrationSprites = [];
let clearCelebrationTimer = 0;
let clearWave2Spawned = false;
// 要望対応：クリア演出。各列が「くねった曲線の隊列」で画面下から上昇。
// 各体のX位置はrow（縦位置）に応じてsin波でずれており、列全体が蛇のように曲線を描く。
// 演出は全員が画面上端を抜けてから2秒の余韻（clearAfterGlow）→リザルト。
// 1波目が全員画面外へ出るのに約6.2秒かかるため、2波目は6.5秒後にスポーン
// 全体：6.5秒（2波目スポーン）+ 6.2秒（2波目上昇）= 約12.7秒 → 13秒を上限に
const CLEAR_CELEBRATION_MS = 20000; // 9000(1波脱出)+9000(2波脱出)+2000(余裕)
const CLEAR_WAVE2_DELAY_MS = 9000;  // 16行波が全員抜けるのに約8.5秒（landscape基準）
const CEL_RISE_SPEED = (rows + 6) / 5.0; // 全員が画面外へ抜けるのに約5秒（rows依存）

function spawnClearCelebrationWave(startIndex){
  const spacingX = cols / 8;
  for(let col = 0; col < 8; col++){
    const baseX = spacingX * (col + 0.5);
    // 列ごとに曲線の位相・振幅・周波数を変える
    // 列間隔 = cols/8 = 3.0。振幅の最大は1.0（隣列との間隔3.0の1/3）で重ならない
    const colPhase = (col / 8) * Math.PI * 2;
    const amp      = 0.7 + (col % 3) * 0.2;     // 0.7〜1.1（広い横幅、列間隔の1/3以下）
    const snakeFreq = 0.55 + (col % 4) * 0.08;  // 1列内のsin波の繰り返し数（波長）
    for(let row = 0; row < 16; row++){            // 8行→16行（128文字/波）
      const kanji = KANJI_POOL[(startIndex + col * 16 + row) % KANJI_POOL.length];
      const startY = rows + 2 + row * 1.1;
      // 各体のX：rowに応じてsin波でずれる → 列全体が最初から曲線状に配置される
      const snakeX = baseX + Math.sin(row * snakeFreq + colPhase) * amp;
      celebrationSprites.push({
        ch: kanji[0], baseX, snakeFreq, colPhase, amp,
        y: startY,
        x: snakeX,   // 現在位置（更新時にrowから再計算する）
        row,         // 行インデックス（x再計算に使用）
        color: ROW_COLOR_PALETTE[(col + row) % ROW_COLOR_PALETTE.length],
        t: 0
      });
    }
  }
}
function startClearCelebration(){
  clearTimeMs = elapsed;
  enemies = []; eBullets = []; pBullets = [];
  celebrationSprites = [];
  state = 'clearCelebration';

function lerpColorToWhite(hex, t){
  const r = parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const nr = Math.round(r+(255-r)*t), ng=Math.round(g+(255-g)*t), nb=Math.round(b+(255-b)*t);
  return `rgb(${nr},${ng},${nb})`;
}

function damageEnemy(e, isBoss){
  e.hp -= 1; e.hitFlash=120; SFX.hit();
  if(e.hp<=0){
    const base = isBoss ? 6000 : (e.strokes*20);
    combo++; comboMax=Math.max(comboMax,combo);
    const multiplier = combo<=8 ? (1+combo*0.15) : (1+32*0.15) * Math.pow(1.25, combo-8);
    const gained = Math.floor(base*multiplier);
    let gainedBig = BigInt(Math.max(0, gained));
    if(combo>=8) gainedBig = gainedBig*gainedBig; // 要望対応：8連撃目から、撃破点そのものを1撃ごとに二乗にする

    score = score + gainedBig;

    addParticles(e.x,e.y, isBoss?18:8, '#ff3b3b');
    addPopup(e.x,e.y,'連撃'+kanjiNum(combo),'#ffee33');
    SFX.destroy();
    if(isBoss){
      bossActive=null;
      skipRestOfFrame = true; // 撃破直後の同フレームで残存敵弾に当たって即ゲームオーバーになる競合を防ぐ
      if(stageIndex<2){
        stageIndex++;
        if(stageIndex===2) startWarpEffect(); // ステージ3突入：ワープ演出開始
        stageStartElapsed=elapsed;
        startApproachPhase();
        ensureAudio();
        if(stageIndex===1) playStage2(); // ステージ2：プロムナード・アレンジ（ループ）
        else if(stageIndex===2) playDashLoop(); // ステージ3：Dash!をVEZARエンジンでループ再生
      } else {
        // 要望対応：最終ボスは爆散を派手に（追加のパーティクルバースト＋派手な爆音）してからクリア演出へ
        // 不具合修正：画面外まで爆散が届く範囲に拡大し、持続時間も現行の3倍にした
        addBigExplosionParticles(e.x,e.y, 60, '#ffffff');

        stopSong(); // ボス3撃破でBGM停止（クリア演出は無音）
        startClearCelebration();
      }
    }
    return true;
  }
  return false;
}

// Firebase側の実処理（submitScore/getRanking）は末尾の<script type="module">がwindow.KCRankingに公開する。

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ NGワード判定（hashes.txt.gzを展開せず参照） ============
// マッチ時のみ小文字化してハッシュ照合、問題なければ元の入力（大文字小文字そのまま）を復帰させる。
let ngHashSetPromise = null;
function loadNgHashes(){
  if(ngHashSetPromise) return ngHashSetPromise;
  ngHashSetPromise = (async () => {
    try{
      const res = await fetch('hashes.txt.gz');
      const ds = new DecompressionStream('gzip');
      const text = await new Response(res.body.pipeThrough(ds)).text();
      return new Set(text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean));
    }catch(e){
      console.error('NGワードリストの読み込みに失敗しました', e);
      return new Set(); // 失敗時はフィルタなしでゲーム進行を止めない
    }
  })();
  return ngHashSetPromise;
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function filterNgName(rawName){
  const trimmed = (rawName||'').trim();
  if(!trimmed) return trimmed;
  try{
    const hashes = await loadNgHashes();
    const hash = await sha256Hex(trimmed.toLowerCase());
    if(hashes.has(hash)) return 'ゲスト';
  }catch(e){ console.error(e); }
  return trimmed; // 該当なしなら元の大文字小文字のまま返す
}

// 要望対応：オープニング／スタッフロールは同種のスクロール演出なので、初期化計算を共通化
function computeScrollTiming(lines, lineUnitLines, speedMsPerCell){
  const lineHeight = cell*0.9*lineUnitLines;

  const scrollMs = distance * speedMsPerCell / cell;

/* ============================================================
   毎フレームの更新処理（ロジック）
   ============================================================ */
const LOGIC_STEP=1000/60;
let logicAccum=0, lastTime=performance.now();

// ============ ボスのステージ別設定（データ駆動） ============
// 第二形態と第三形態の移動軌道は完全に同一だったため共通化する（sin/cosの複雑軌道へ滑らかに合流）
function bossOrbitMove(b, elapsed){
  const t = elapsed - b.moveT0;
  const targetX = cols/2 + Math.sin(t/1100)*5 + Math.cos(t/1900)*1.8;
  const targetY = b.baseY + Math.sin(t/1500)*1.6;
  const ease = Math.min(1, t/1200); // 最初の1.2秒は現在地から滑らかに合流
  b.x += (targetX-b.x)*0.05*(0.3+ease*0.7);
  b.y += (targetY-b.y)*0.05*(0.3+ease*0.7);
}
// ラスボス（第三形態）専用：画面全体を縦横に縦断する大振り軌道。
// sin/cosの多重合成で不規則感を保ちつつ、Y方向の振幅を画面全体に広げる。
// 初期降下を上1/4で止めず、画面中央あたりで受け取ってそのまま動的に更新する
function bossFinalMove(b, elapsed){
  const t = elapsed - b.moveT0;
  const ease = Math.min(1, t/1500);
  // X：画面端ぎりぎりまで広く動く（±cols/2 - 2margin）
  const targetX = cols/2
    + Math.sin(t/900)*( cols/2 - 2.5)
    + Math.cos(t/2300)*2.5;
  // Y：rows全体を使う。中央(rows/2)を基点に上端〜下端まで振り切る
  // ゆっくりした大周期 + 速い小周期の合成で「読めない」動きに
  const targetY = rows/2
    + Math.sin(t/1800)*( rows/2 - 1.5)   // 大振り：ほぼ上端〜下端
    + Math.cos(t/1100)*1.8                // 中振り：引っかかり感を出す
    + Math.sin(t/500 + Math.PI)*0.6;     // 小振り：細かい揺れ
  b.x += (targetX - b.x) * 0.04 * (0.3 + ease*0.7);
  b.y += (targetY - b.y) * 0.04 * (0.3 + ease*0.7);
}
const BOSS_STAGE_CONFIG = [
  { // 第一形態：シンプルな横揺れ・単純な3方向弾（現状維持）
    move(b, elapsed, dt){ b.x += Math.sin(elapsed/900)*(dt/1000)*1.2; },
    fireInterval: 850,
