  { // 第二形態：sin/cosの複雑軌道＋広がる弾＋螺旋弾（回転する放射弾）を追加
    move: bossOrbitMove,
    fireInterval: 600,
    fire(b, elapsed){
      fireEnemyBullet(b,5); fireRadialBullets(b,4,3.6,elapsed/600);
      if(Math.floor(elapsed/600)%3===0) fireAimedBullet(b,6.0); // 要望対応：さらに派手に、狙い撃ちを織り交ぜる
    }
  },
  { // 第三形態（ラスボス）：画面全体を縦横に縦断する大振り軌道＋弾幕＋追尾弾
    move: bossFinalMove,
    fireInterval: 380,
    fire(b, elapsed){
      fireRadialBullets(b, 5, 4.5, elapsed/450);  // 10 → 5 に半減
      if(Math.floor(elapsed/380)%6===0) fireRadialBullets(b, 12, 3.3, 0); // 要望対応：さらに派手に、定期的に全方位の大きな一斉射撃
      // 要望対応：前の追尾弾が画面外に消えるまで次の追尾弾は撃たない
      if(!eBullets.some(x=>x.homing)) fireHomingBullets(b, 2, 5.5);
    }
  }
];

function updateApproachPhase(dt){
  if(!approachActive) return;
  approachTimer -= dt;
  const spawningAllowed = approachTimer>0 && approachSpawnedCount<approachQuota;
  if(stageIndex!==2 && spawningAllowed){
    approachSpawnTimer -= dt;
    if(approachSpawnTimer<=0){
      spawnApproachEnemy();
      approachSpawnTimer = 110+Math.random()*90;
    }
  }
  // 要望対応：ステージ2冒険篇に8文字編隊を追加（cos/sinで上から下へ、1冒険篇あたり約4編隊）
  const advFormationDone = stageIndex!==1 || advFormationSpawned>=ADV_FORMATION_QUOTA;
  if(stageIndex===1 && approachTimer>0 && !advFormationDone){
    advFormationSpawnTimer -= dt;
    if(advFormationSpawnTimer<=0){
      spawnAdventureFormation();
      advFormationSpawnTimer = 2200+Math.random()*600;
    }
  }
  // 10秒経過後は新規に発生しないだけ。既存の敵は消さず、倒しきったら本編へ進む
  if(!spawningAllowed && advFormationDone && enemies.length===0){
    approachActive = false;
    setupFormationForStage(); // 本編編隊を開始
  }
}

function updateStageGrace(dt){
  if(graceWaitingForAssembly){
    const allArrived = enemies.length>0 && enemies.every(e=>e.pattern!=='incoming');
    if(allArrived){ graceWaitingForAssembly=false; stageGraceActive=true; stageGraceTimer=2000; }
  }
  if(stageGraceActive){
    stageGraceTimer -= dt;
    if(stageGraceTimer<=0) stageGraceActive=false;
  }
}

// 編隊クリア判定でウェーブ2/ボスへ進行させる。緊急避難直後は1回だけ抑制する
function updateBossProgression(){
  let suppress = dodgeSuppressNext;
  dodgeSuppressNext = false;
  if(suppress) return false;
  if(approachActive || bossSpawnedFor[stageIndex] || bossActive || bossPending) return false;
  const BOSS_SAFETY_TIMEOUT = 50000; // 万一編隊を倒しきれない場合の保険（編隊クリアが基本トリガー）
  const formationCleared = enemies.length===0;
  if(stageIndex===0 && formationCleared && stageWave<1){
    stageWave = 1;
    spawnStage0Wave(); // 2ウェーブ目
    return false;
  }
  if(formationCleared || (gameMode==='timeattack' && (elapsed-stageStartElapsed)>=BOSS_SAFETY_TIMEOUT)){
    bossSpawnedFor[stageIndex]=true;
    triggerBossSequence();
    return true; // このフレームはここで打ち切り
  }
  return false;
}

function updateDodge(){
  if(!input.dodgeRequested) return;
  input.dodgeRequested=false;
  enemies.forEach(e=>{ addParticles(e.x,e.y,6,'#66ccff'); score += BigInt(Math.floor(e.strokes*10)); });
  enemies=[]; eBullets=[];
  dodgeSuppressNext = true; // 次フレームの進行判定を1回だけ抑制
  if(bossActive) addParticles(bossActive.x,bossActive.y,10,'#66ccff');
  SFX.dodge();
  addPopup(player.x, player.y-1, '緊急避難', '#99e6ff');
  dodgeUsesUsed++;
  // コナミコマンドのフリーモードは、そのプレイ中（ゲーム終了までorタイトルに戻るまで）持続する
}

let playerTopLocked = false; // 要望対応：一番上に到達したら、一番下に着くまで上方向へ動けなくする
function updatePlayerMovement(dt){
  if(input.active){
    const TOUCH_OFFSET_Y = (demoActive || usingDirectionalMove) ? 0 : 1.2; // タッチ/クリック位置より少し上に表示（指で自機が隠れる問題の対策）。デモ・キーボード/ゲームパッド操作では適用しない
    const tx=Math.max(0.5,Math.min(cols-0.5,input.x));
    let tyRaw=Math.max(0.5,Math.min(rows-0.5,input.y-TOUCH_OFFSET_Y));
    // 不具合修正：この上端ロックはプレイ中は無効化（プレイヤーからバグと判断されたため）。デモ中のみ有効
    if(demoActive){
      if(player.y<=1.0) playerTopLocked = true; // 一番上に到達
      if(playerTopLocked && player.y>=rows-1.5) playerTopLocked = false; // 一番下まで来たら解除
    } else {
      playerTopLocked = false;
    }
    const ty = playerTopLocked ? Math.max(tyRaw, player.y) : tyRaw; // ロック中は現在地より上には行けない（左右・下方向のみ）
    const dx=tx-player.x, dy=ty-player.y;
    const dist=Math.hypot(dx,dy);
    // ワープ修正：瞬間移動ではなく「ものすごい速さで到達」させる。30fps基準で速度上限を設定
    // デモ中は要望対応でゆっくり滑らかに動かす（20ドット程度の移動が一瞬でスナップしないように）
    // 要望対応：キーボード/ゲームパッド操作時のみ移動速度を変更（タッチ/マウスは従来通り2.0固定）。
    // ゲームパッドのアナログ傾き量（0〜1）と、Shift/低速ボタン押下中はさらに速度を落とす。
    // 調整したい場合はファイル冒頭付近のKEY_MOVE_SPEED_CELLS_PER_30FPS等を変更してください
    const slowActive = keySlowHeld || gpSlowHeld;
    const analogMag = usingDirectionalMove ? directionalAnalogMag : 1;
    const directionalSpeed = KEY_MOVE_SPEED_CELLS_PER_30FPS * analogMag * (slowActive ? SLOW_MOVE_SCALE : 1);
    const MAX_SPEED_CELLS_PER_30FPS = demoActive ? 0.4 : (usingDirectionalMove ? directionalSpeed : 2.0);
    const maxStep = MAX_SPEED_CELLS_PER_30FPS * (dt/(1000/30));
    if(dist<=maxStep || dist===0){
      player.x=tx; player.y=ty;
    } else {
      player.x += dx/dist*maxStep;
      player.y += dy/dist*maxStep;
    }
  }
  if(player.invuln>0) player.invuln -= dt;
}

function updatePlayerFire(dt){
  const manualFireActive = (keyFireHeld || gpFireHeld) && !demoActive; // Z/ゲームパッドAによる明示的な発射
  const autoFireActive = demoActive
    ? input.active
    : (pointerHeld && input.active && touchAutoFireEnabled); // 要望対応：連射トグルOFF中はタッチ/マウスでも自動連射しない
  if(autoFireActive || manualFireActive){
    if(demoActive){
      if(demoFireStopTimer>0){ demoFireStopTimer -= dt; return; } // 要望対応：時々撃たずに止まる
      if(Math.random()<0.001) demoFireStopTimer = 250+Math.random()*400;
    }
    const held = manualFireActive ? 200 : (performance.now()-input.downTime); // Z/Aボタンは押した瞬間から即座に発射（ディレイなし）
    if(held>=200){
      player.fireTimer -= dt;
      if(player.fireTimer<=0){ pBullets.push({x:player.x,y:player.y-0.6,vx:0,vy:-28}); player.fireTimer=140; SFX.shot(); }
    }
  } else { player.fireTimer=0; }
}

function updateEnemies(dt){
  // O(n)で1回だけカウントし直す。以後このフレーム内はcountDiving()→_divingCountを返すだけ
  _divingCount = 0;
  for(const e of enemies){ if(e.pattern==='peel' && e.diveState!=='hover') _divingCount++; }
  updateFormationAnchor(dt);
  enemies.forEach(e=>updateFormationEnemy(e,dt));
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hitFlash>0) e.hitFlash-=dt;
    e.fireTimer -= dt;
    if(e.fireTimer<=0 && e.x>0 && e.x<cols && e.y>0 && e.y<rows-1 && !stageGraceActive){ fireEnemyBullet(e,1); e.fireTimer=2000+Math.random()*2200; }
    if(e.pattern==='march' && e.y>rows+2){ enemies.splice(i,1); combo=0; }
    if(e.pattern==='approach' && e.y>rows+2){ enemies.splice(i,1); }
    if(e.pattern==='advFormation' && e.y>rows+2){ enemies.splice(i,1); }
  }
}

function updateBoss(dt){
  if(!bossActive) return;
  const b=bossActive;
  if(b.vy>0){
    b.y += b.vy*dt/1000;
    // ラスボス（ステージ2）は画面全体を使う軌道のため、中央付近まで降下させてから軌道へ渡す
    const stopThreshold = stageIndex===2 ? rows*0.45 : rows*0.28;
    if(b.y>stopThreshold){ b.vy=0; b.baseY=b.y; b.moveT0=elapsed; }
  } else {
    const cfg = BOSS_STAGE_CONFIG[Math.min(stageIndex, BOSS_STAGE_CONFIG.length-1)];
    cfg.move(b, elapsed, dt);
  }
  b.x = Math.max(2,Math.min(cols-2,b.x));
  b.y = Math.max(1,Math.min(rows-2,b.y));
  b.fireTimer -= dt;
  if(b.fireTimer<=0 && !stageGraceActive){
    const cfg = BOSS_STAGE_CONFIG[Math.min(stageIndex, BOSS_STAGE_CONFIG.length-1)];
    cfg.fire(b, elapsed);
    b.fireTimer = cfg.fireInterval;
  }
  if(b.hitFlash>0) b.hitFlash-=dt;

  // ランダム敵の補充：冒険モードと同じロジックを2サイクル（10秒×2＝20秒）繰り返す
  if(bossEscortCycle<2){
    bossEscortCycleTimer -= dt;
    const spawningAllowed = bossEscortCycleTimer>0 && bossEscortCycleSpawned<BOSS_ESCORT_CYCLE_QUOTA;
    if(spawningAllowed){
      bossEscortSpawnTimer -= dt;
      if(bossEscortSpawnTimer<=0){
        spawnApproachEnemy(); // 冒険モードそのまま：上から下に流れる敵
        bossEscortCycleSpawned++;
        bossEscortSpawnTimer = 300+Math.random()*200;
      }
    } else if(bossEscortCycleTimer<=0){
      bossEscortCycle++;
      bossEscortCycleTimer = 10000;
      bossEscortSpawnTimer = 0;
      bossEscortCycleSpawned = 0;
    }
  }
}

function updatePlayerBullets(dt){
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];
    b.x+=b.vx*dt/1000; b.y+=b.vy*dt/1000;
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const r=0.35+e.strokes/2*0.045;
      if(Math.hypot(b.x-e.x,b.y-e.y)<r){ hit=true; const dead=damageEnemy(e,false); if(dead) enemies.splice(j,1); break; }
    }
    if(!hit && bossActive){
      const r=0.9;
      if(Math.hypot(b.x-bossActive.x,b.y-bossActive.y)<r){ hit=true; damageEnemy(bossActive,true); }
    }
    if(hit||b.y<-1){ pBullets.splice(i,1); if(!hit) combo=0; }
  }
}

function updateEnemyBullets(dt){
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    if(b.homing && b.homingTurnsLeft>0){
      b.homingReaimTimer -= dt;
      if(b.homingReaimTimer<=0){
        b.homingTurnsLeft--;
        b.homingReaimTimer = 500;
        const dx=player.x-b.x, dy=player.y-b.y, d=Math.hypot(dx,dy)||1;
        const speed=Math.hypot(b.vx,b.vy)||5;
        b.vx = dx/d*speed; b.vy = dy/d*speed; // 1回分の「追いかけ」：自機方向へ直接切り替える
      }
    }
    b.x+=b.vx*dt/1000; b.y+=b.vy*dt/1000;
    if(b.y>rows+1||b.x<-1||b.x>cols+1){ eBullets.splice(i,1); continue; }
    if(player.invuln<=0 && !invincibleMode){
      const r=0.12;
      if(Math.hypot(b.x-player.x,b.y-player.y)<r){
        eBullets.splice(i,1); player.hp-=1; player.invuln=1200; combo=0;
        addParticles(player.x,player.y,10,'#ff5555'); SFX.playerHit();
        if(player.hp<=0){
          if(demoActive){ attractPhase='demoover'; attractPhaseTimer=0; state='demoover'; }
          else { endGame('gameover'); }
          return true;
        }
      }
    }
  }
  return false;
}

function updateEffects(dt){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.t+=dt; p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; if(p.t>p.life) particles.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.t+=dt; p.y-=dt/1000*0.6; if(p.t>p.life) popups.splice(i,1); }
}

function updateStars(dt){
  if(warpActive){ updateWarp(dt); return; }
  if(stageIndex >= 2){ updateMatrixStreams(dt); return; }
  // ステージ0-1：通常の流れ星（・）
  stars.forEach(s=>{ s.y += s.speed*dt/1000; s.twinklePhase += s.twinkleSpeed*dt/1000; if(s.y>rows){ s.y=-1; s.x=Math.random()*cols; } });
}

function updateLogic(dt){
  if(state==='opening'){
    openingScroll.timer += dt;
    if(openingScroll.timer >= openingScroll.scrollMs + OPENING_HOLD_MS){ markSeenOpening(); enterTitle(); }
    return;
  }
  if(state==='clearCelebration'){
    clearCelebrationTimer += dt;
    if(!clearWave2Spawned && clearCelebrationTimer>=CLEAR_WAVE2_DELAY_MS){
      spawnClearCelebrationWave(128); // 2波目：128〜255番目の漢字
      clearWave2Spawned = true;
    }
    // 各スプライトが列全体を曲線に保ちながら上昇
    celebrationSprites.forEach(s=>{
      s.t += dt;
      s.y -= CEL_RISE_SPEED * dt / 1000;
      // rowと時間の両方でsin波を作ることで、列が蛇のようにくねりながら上昇する
      s.x = s.baseX + Math.sin(s.row * s.snakeFreq + s.colPhase + s.t * 0.0008) * s.amp;
    });
    updateEffects(dt);
    updateStars(dt);
    // 2波目スポーン済みかつ全員が画面上端より上に出たら余韻へ（保険の上限はCLEAR_CELEBRATION_MS）
    const allGone = clearWave2Spawned && celebrationSprites.length > 0 && celebrationSprites.every(s => s.y < -1);
    if(allGone || clearCelebrationTimer >= CLEAR_CELEBRATION_MS){
      state = 'clearAfterGlow';
      clearCelebrationTimer = 0;
    }
    return;
  }
  if(state==='clearAfterGlow'){
    // 余韻2秒：演出終了後の画面をそのまま表示してからリザルトへ
    clearCelebrationTimer += dt;
    updateEffects(dt); updateStars(dt);
    if(clearCelebrationTimer >= 2000){ endGame('clear'); }
    return;
  }
  if(state==='warning'){
    bossClearTimer -= dt;
    if(bossClearTimer<=0){ actuallySpawnBoss(); SFX.warning(); }
    return;
  }
  if(state==='result'){
    if(resultReason==='clear'){
      resultClearTimer += dt;
      if(resultClearTimer >= RESULT_TO_STAFFROLL_MS){ startStaffRoll(); }
    }
    return;
  }
  if(state==='staffroll'){
    staffRollScroll.timer += dt;
    if(staffRollScroll.timer >= staffRollScroll.scrollMs + STAFF_ROLL_HOLD_MS){ finishStaffRollFlow(); }
    return;
  }
  if(state==='title'){
    updateStars(dt); // 要望対応：タイトル（アトラクトのランキング表示中も含む）で星を流す
    if(!attractMode){
      idleTimer += dt;
      if(idleTimer >= ATTRACT_START_IDLE_MS){
        attractMode = true; attractPhase = 'title'; attractPhaseTimer = 0;
      }
    } else {
      attractPhaseTimer += dt;
      if(attractPhase==='title' && attractPhaseTimer >= ATTRACT_TITLE_MS){
        attractPhase = 'ranking'; attractPhaseTimer = 0; showAttractRanking();
      } else if(attractPhase==='ranking' && attractPhaseTimer >= ATTRACT_RANKING_MS){
        attractPhase = 'demo'; attractPhaseTimer = 0; hideAttractRanking(); startAttractDemo();
      }
    }
    return;
  }
  if(state==='demoover'){
    attractPhaseTimer += dt;
    if(attractPhaseTimer >= ATTRACT_DEMO_OVER_MS){
      demoActive = false; attractPhase = 'title'; attractPhaseTimer = 0; enterTitle();
    }
    return;
  }
  elapsed += dt;
  if(gameMode==='timeattack' && !demoActive && elapsed>=GAME_DURATION){ endGame('timeup'); return; }

  if(demoActive){
    // 人間らしい動きへの改善：①方向の持続性（慣性）②敵弾を避ける/敵に近づく反応③緩急（たまに静止）
    // ※「左右往復バイアス」は今回のスコープ外
    if(demoPauseTimer>0){
      demoPauseTimer -= dt;
      input.active = true;
      input.x = player.x; input.y = player.y; // 狙いを定めているように、その場に留まる
    } else {
      // 一番近い脅威（敵弾）と一番近い獲物（敵）を探す
      let threat=null, threatDist=Infinity;
      for(const b of eBullets){
        const d = Math.hypot(b.x-player.x, b.y-player.y);
        if(d<3.5 && d<threatDist){ threat=b; threatDist=d; }
      }
      let prey=null, preyDist=Infinity;
      for(const e of enemies){
        const d = Math.hypot(e.x-player.x, e.y-player.y);
        if(d<preyDist){ prey=e; preyDist=d; }
      }
      let desiredAngle, turnRate;
      if(threat){
        desiredAngle = Math.atan2(player.y-threat.y, player.x-threat.x); // 弾から逃げる
        turnRate = 0.5; // 危険には素早く反応
      } else if(bossActive){
        // 要望対応：誘導弾と同じ「対象へ向けて補正し続ける」考え方を自機の位置合わせに使う。
        // 弾自体は直上のまま変えず、自機の方をボスの真下へ横方向中心に寄せる。
        // 不具合修正：横方向のみに固定していたため、ボス戦中ずっと縦に動けず画面下に
        // 張り付いたままになる不具合があった。緩やかな縦方向の揺れを加えて解消する
        const verticalWobble = Math.sin(elapsed/1500)*0.5;
        desiredAngle = Math.atan2(verticalWobble, bossActive.x-player.x);
        turnRate = 0.35; // 不具合修正：追従が遅くボスの真下からずれ続けて倒せない問題の対策として追従速度を上げた
      } else if(prey && Math.random()<0.7){
        desiredAngle = Math.atan2(prey.y-player.y, prey.x-player.x); // 近くの敵へ近づく
        turnRate = 0.08;
      } else {
        // 要望対応：目的がない状態で端付近に留まり続けて「固まる」問題の修正。
        // 端に近いときは中央方向へ、それ以外は従来通り現在の方向を維持
        const nearEdge = player.x<1.5 || player.x>cols-1.5 || player.y<1.5 || player.y>rows-1.5;
        if(nearEdge){
          desiredAngle = Math.atan2(rows/2-player.y, cols/2-player.x);
          turnRate = 0.15;
        } else {
          desiredAngle = demoDirAngle;
          turnRate = 0.08;
        }
      }
      let da = desiredAngle - demoDirAngle;
      while(da>Math.PI) da -= Math.PI*2;
      while(da<-Math.PI) da += Math.PI*2;
      demoDirAngle += da*turnRate; // 急な方向転換をせず慣性で滑らかに追従

      const rangeCells = 20/cell;
      let nx = player.x + Math.cos(demoDirAngle)*rangeCells;
      const ny = player.y + Math.sin(demoDirAngle)*rangeCells;

      // 要望対応：右端に到達したら右への移動を却下、左端に到達したら左への移動を却下。
      // どちらも中央（cols/2）を超えるまで解除しない。脅威回避/獲物追跡より優先して最終的にnxへ適用する
      if(player.x >= cols-1.5) demoEdgeLockRight = true;
      if(player.x <= 1.5) demoEdgeLockLeft = true;
      if(player.x < cols/2) demoEdgeLockRight = false;
      if(player.x > cols/2) demoEdgeLockLeft = false;
      if(demoEdgeLockRight && nx > player.x) nx = player.x;
      if(demoEdgeLockLeft && nx < player.x) nx = player.x;

      input.active = true;
      input.x = Math.max(0.5, Math.min(cols-0.5, nx));
      input.y = Math.max(0.5, Math.min(rows-0.5, ny));
      input.downTime = performance.now() - 500; // 発射ディレイ(0.2秒)を満たした状態にしておく

      if(!threat && Math.random()<0.003){ demoPauseTimer = 300+Math.random()*400; } // たまに一瞬静止（緩急）
    }
  }

  updateApproachPhase(dt);
  updateStageGrace(dt);
  if(updateBossProgression()) return;
  updateDodge();
  updateDirectionalMovement();
  updatePlayerMovement(dt);
  updatePlayerFire(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updatePlayerBullets(dt);
  if(skipRestOfFrame){ skipRestOfFrame = false; return; }
  if(updateEnemyBullets(dt)) return;
  updateEffects(dt);
  updateStars(dt);
}

// 要望対応：低スペック端末を基準に描画30fpsとしていたが、実際に処理落ちしていないか
// （直近の実測フレーム時間）を見て、余裕があれば60fpsへ、処理落ちの兆候があれば30fpsへ
// 自動で切り替える（機種名でなく実測値で判断するため、発熱や他アプリの負荷にも追従できる）

/* ============================================================
   描画（アダプティブFPS・各画面の描画）
   ============================================================ */
let renderAccum=0;
let RENDER_STEP=1000/30;
const FPS_SAMPLE_SIZE = 60; // 直近60フレーム分のdtで判定
const fpsSamples = [];
const FPS_UPGRADE_MS = 17.5;   // この値を下回る（＝60fps相当で余裕がある）状態が続いたら60fpsへ
const FPS_DOWNGRADE_MS = 22;   // この値を上回る（＝処理落ちの兆候）状態が続いたら30fpsへ
function trackFrameTiming(dt){
  fpsSamples.push(dt);
  if(fpsSamples.length > FPS_SAMPLE_SIZE) fpsSamples.shift();
  if(fpsSamples.length < FPS_SAMPLE_SIZE) return; // サンプルが揃うまでは判定しない
  const avg = fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
  if(RENDER_STEP > 1000/59 && avg < FPS_UPGRADE_MS){ RENDER_STEP = 1000/60; }
  else if(RENDER_STEP < 1000/31 && avg > FPS_DOWNGRADE_MS){ RENDER_STEP = 1000/30; }
}

function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  drawStars();
  if(state==='title') drawTitle();
  else if(state==='opening') drawOpening();
  else if(state==='playing'){
    drawGame();
    if(demoActive) drawDemoGameOver();
    else { drawPauseButton(); drawFireToggleButton(); drawFpsDisplay(); drawVersionDisplay(); if(paused) drawPauseOverlay(); }
  }
  else if(state==='warning'){ drawGame(); drawWarning(); }
  else if(state==='clearCelebration'){ drawClearCelebration(); }
  else if(state==='clearAfterGlow'){ drawClearAfterGlow(); }
  else if(state==='result'){ drawGame(); drawResult(); }
  else if(state==='staffroll') drawStaffRoll();
  else if(state==='demoover'){ drawGame(); drawDemoGameOver(); }
}

// 要望対応：ポーズ機能。画面下部の帯（BOTTOM_UI_ZONE_START〜下端）は移動に使わない領域とし、
// その左下にポーズボタン（「止」）を配置する。ポーズ中は音楽もWeb Audio APIのsuspend/resumeで
// 時刻ごと綺麗に止める（予約済みの演奏も含めて正確に再開できる）
let paused = false;
const BOTTOM_UI_ZONE_START = 0.9; // 画面下から1割を非移動領域に
function isPauseButtonHit(cx,cy){
  return cx > W*0.02 && cx < W*0.20 && cy > H*BOTTOM_UI_ZONE_START && cy < H;
}
// 要望対応：連射ON/OFFトグル（タッチ専用）。キーボード/ゲームパッドは対象外（Z/Aボタンで
// 個別に発射制御できるため、この問題が起きない）。タッチだけは接触中に強制的に自動連射される
// 仕様のため、移動だけしたい場面で不利になる。トグルで自動連射を止められるようにする
let touchAutoFireEnabled = true;
function isFireToggleButtonHit(cx,cy){
  return cx > W*0.22 && cx < W*0.40 && cy > H*BOTTOM_UI_ZONE_START && cy < H;
}
function toggleTouchAutoFire(){ touchAutoFireEnabled = !touchAutoFireEnabled; }
function togglePause(){
  if(state!=='playing' || demoActive) return;
  paused = !paused;
  if(actx){ if(paused) actx.suspend(); else actx.resume(); }
}
// 画面下部の「止」「連」ボタンは帯を敷いて文字を中央に置くだけで同一構造だったため共通化する
function drawBottomUiButton(label, left, bgColor, fgColor){
  ctx.save();
  ctx.fillStyle = bgColor;
  ctx.fillRect(W*left, H*BOTTOM_UI_ZONE_START, W*0.18, H*(1-BOTTOM_UI_ZONE_START));
  ctx.restore();
  drawText(label, W*(left+0.09), H*(BOTTOM_UI_ZONE_START + (1-BOTTOM_UI_ZONE_START)/2), { size: cell*0.8, color: fgColor });
}
function drawPauseButton(){ drawBottomUiButton('止', 0.02, 'rgba(255,255,255,0.15)', '#fff'); }
// 要望対応：連射ON/OFFトグルボタンの描画（ONは緑系、OFFは灰色でひと目で分かるように）
function drawFireToggleButton(){
  drawBottomUiButton('連', 0.22,
    touchAutoFireEnabled ? 'rgba(139,255,59,0.22)' : 'rgba(255,255,255,0.08)',
    touchAutoFireEnabled ? '#8aff3b' : '#888');
}
// 要望対応：右下（非移動領域）に現在の実測FPSを表示（アラビア数字OK、デバッグ用に親切なため）
function drawFpsDisplay(){
  const fps = fpsSamples.length>0 ? Math.round(1000/(fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length)) : Math.round(1000/RENDER_STEP);
  // 要望対応：緊急避難の文字と重ならないよう、その真上に配置
  drawText(fps+' fps', W-10, H-cell*1.7, { align:'right', size: cell*0.45, color:'rgba(255,255,255,0.6)' });
}
// 要望対応：画面内左下（非移動領域、ポーズボタン・連ボタンの下行）にバージョン情報を常時表示
// 題名画面からも呼ぶため、縦の基準位置だけ引数で切り替えられるようにしている
function drawVersionDisplay(baseline){
  drawText(KCV_VERSION, W*0.02, H*0.995, { align:'left', baseline: baseline || 'bottom', size: cell*0.35, color:'rgba(255,255,255,0.3)' });
}
function drawPauseOverlay(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.restore();
  drawText('一時停止', W/2, H*0.45, { size: cell*1.5, bold: true, color: '#fff' });
  drawText('もう一度「止」またはStartで再開', W/2, H*0.55, { size: cell*0.55, color: '#88ff88' });
}

function drawStars(){
  if(warpActive){ drawWarp(); return; }
  if(stageIndex >= 2){ drawMatrixStreams(); return; }
  // ステージ0-1：通常の流れ星（・）
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  stars.forEach(s=>{
    const twinkle = 0.6 + 0.4*Math.sin(s.twinklePhase);
    ctx.globalAlpha = s.alphaBase * twinkle;
    ctx.fillStyle = s.color;
    ctx.font=`${cell*s.size}px monospace`;
    ctx.fillText('・', gx(s.x), gy(s.y));
  });
  ctx.globalAlpha=1; ctx.restore();
}

function drawTitle(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ff3b3b'; ctx.font=`bold ${cell*3}px monospace`;
  ctx.fillText('漢字超戦', W/2, H*0.38);
  ctx.fillStyle='#ffd23b'; ctx.font=`${cell*0.9}px monospace`;
  ctx.fillText('タップしてスタート', W/2, H*0.55);
  // 要望対応：キーボード/タッチで選択中のモードを背景ハイライトで明示。決定した瞬間は光って点滅する
  ctx.save();
  const hlY = H*0.625 - cell*0.4, hlH = cell*0.8;
  const flashing = performance.now() < titleDecideFlashUntil;
  const flashPhase = flashing ? (Math.sin((titleDecideFlashUntil-performance.now())*0.06) + 1)/2 : 0; // 点滅
  if(gameMode==='timeattack'){
    ctx.fillStyle = flashing ? `rgba(255,255,255,${0.35+0.5*flashPhase})` : 'rgba(59,176,255,0.22)';
    ctx.fillRect(W*0.06, hlY, W*0.42, hlH);
  } else {
    ctx.fillStyle = flashing ? `rgba(255,255,255,${0.35+0.5*flashPhase})` : 'rgba(59,255,176,0.22)';
    ctx.fillRect(W*0.52, hlY, W*0.42, hlH);
  }
  ctx.restore();
  ctx.fillStyle='#3bb0ff'; ctx.font=`${cell*0.55}px monospace`;
  ctx.fillText('３分間タイムアタック', W*0.27, H*0.625);
  ctx.fillStyle='#3bffb0'; ctx.font=`${cell*0.55}px monospace`;
  ctx.fillText('時間無制限', W*0.73, H*0.625);
  ctx.fillStyle='#555'; ctx.font=`${cell*0.4}px monospace`;
  ctx.fillText('モードを選んでタップ', W/2, H*0.685);
  ctx.fillStyle='#888'; ctx.font=`${cell*0.45}px monospace`;
  ctx.fillText('© 2026 ZANTEI TECHNOLOGY', W/2, H*0.92);
  drawVersionDisplay('middle');
  if(secretTapCount>0 && secretTapCount<SECRET_TAP_REQUIRED){
    ctx.fillStyle='#555'; ctx.font=`${cell*0.4}px monospace`;
    ctx.fillText('・'.repeat(secretTapCount), W/2, H*0.97);
  }
  if(dodgeFreeMode){
    ctx.fillStyle='#66ffcc'; ctx.font=`${cell*0.5}px monospace`;
    ctx.fillText('緊急避難自由モード解禁', W/2, H*0.75);
  }
  if(invincibleMode){
    ctx.fillStyle='#ffcc33'; ctx.font=`${cell*0.5}px monospace`;
    ctx.fillText('無敵モード解禁', W/2, H*(dodgeFreeMode?0.81:0.75));
  }
  ctx.restore();
}

function drawWarning(){
  ctx.save();
  ctx.fillStyle='#ffe600';
  ctx.fillRect(0,H*0.34,W,H*0.24);
  ctx.strokeStyle='#000'; ctx.lineWidth=Math.max(2,cell*0.08);
  ctx.strokeRect(cell*0.4,H*0.34+cell*0.4,W-cell*0.8,H*0.24-cell*0.8);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#000';
  ctx.font=`bold ${cell*1.6}px monospace`;
  ctx.fillText('警告！', W/2, H*0.34+H*0.24*0.42);
  ctx.font=`${cell*0.6}px monospace`;
  const sub = bossPending ? bossPending.sub : '接敵注意';
  ctx.fillText(sub+'！　接敵注意！', W/2, H*0.34+H*0.24*0.75);
  ctx.restore();
}

function hudBackdrop(text, x, y, align){
  // 要望対応：HUD文字が敵文字等と重なって読みにくい問題への対策。文字の背後に半透明の帯を敷く
  const w = ctx.measureText(text).width;
  const pad = 4;
  const bx = align==='right' ? x-w-pad : (align==='center' ? x-w/2-pad : x-pad);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(bx, y-2, w+pad*2, cell*0.85);
  ctx.restore();
}

function drawClearCelebration(){
  drawPlayerChar(1);
  celebrationSprites.forEach(s=>{
    const whiteness = Math.max(0, Math.min(1, 1 - (s.y + 2) / (rows + 4)));
    drawText(s.ch, gx(s.x), gy(s.y), { size: cell*0.9, color: lerpColorToWhite(s.color, whiteness) });
  });
  drawParticleLayer();
}
function drawClearAfterGlow(){
  // 余韻：全員消えた後の星空のみ（パーティクルが残っていれば描く）
  drawParticleLayer();
}

function drawGame(){
  drawPlayerChar(player.invuln>0 ? (Math.floor(elapsed/80)%2===0?0.3:1) : 1);

  enemies.forEach(e=>{
    const size = e.uniformSize ? cell*1.3 : cell*(0.7+Math.min(1.6,e.strokes/16));
    ctx.save();
    const color = e.hitFlash>0 ? '#ffffff' : e.color;
    ctx.fillStyle = color;
    ctx.font=`${size}px monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(e.diveState==='loop'){
      // 宙返り中は文字自体も回転させる
      ctx.translate(gx(e.x), gy(e.y));
      ctx.rotate(e.loopT*Math.PI*2);
      ctx.fillText(e.ch, 0, 0);
    } else if(e.rotAngle && Math.abs(e.rotAngle)>0.01){
      // 斜め移動時〜正面復帰までなめらかに回転（updateFormationEnemyで補間済みのrotAngleを使用）
      ctx.translate(gx(e.x), gy(e.y));
      ctx.rotate(e.rotAngle);
      ctx.fillText(e.ch, 0, 0);
    } else {
      ctx.fillText(e.ch, gx(e.x), gy(e.y));
    }
    ctx.restore();
  });

  if(bossActive){
    const b=bossActive;
    const size=cell*2.4;
    ctx.save();

    // === ゲーミング虹色変化（30fps描画に同期）===
    let bossHue = (elapsed / 8) % 360;  // 速度調整（小さくすると遅く）
    const bossColor = b.hitFlash > 0 ? '#ffffff' : `hsl(${bossHue}, 100%, 65%)`;

    ctx.fillStyle = bossColor;
    ctx.font=`bold ${size}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.ch, gx(b.x), gy(b.y));

    // HPバーも同色で統一
    const bw=cell*6, bh=cell*0.3, bx=W/2-bw/2, by=gy(b.y)-size*0.65;
    ctx.strokeStyle = bossColor;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle = bossColor;
    ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),bh);

    ctx.restore();
  }

  ctx.fillStyle='#8aff3b';
  pBullets.forEach(b=>ctx.fillRect(gx(b.x)-1.5, gy(b.y)-cell*0.4, 3, cell*0.6));
  eBullets.forEach(b=>{
    ctx.fillStyle = b.color || '#ff3b3b';  // 既存の通常弾はそのまま

    // ボス弾だけ虹色グラデ（ボスと同じhueを使用）
    if(bossActive && !b.isNormalBullet){
      const bossHue = (elapsed / 8) % 360;
      ctx.fillStyle = `hsl(${bossHue}, 100%, 75%)`;
    }
    // 要望対応：誘導弾（homing）は他の弾より明度を上げ、白に近い色で区別する
    if(b.homing){
      ctx.fillStyle = '#fff2f2';
    }

    ctx.beginPath();
    ctx.arc(gx(b.x),gy(b.y),cell*0.14,0,7);
    ctx.fill();
  });

  drawParticleLayer();
  drawPopupLayer();

  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font=`bold ${Math.max(14,cell*0.75)}px monospace`;
  { const t1='得点 '+kanjiNum(score); hudBackdrop(t1,10,8,'left'); ctx.fillStyle='#ffcc33'; ctx.fillText(t1, 10, 8); }
  { const t2='連撃 '+kanjiNum(combo); hudBackdrop(t2,10,8+cell*0.9,'left'); ctx.fillStyle='#33e0ff'; ctx.fillText(t2, 10, 8+cell*0.9); }
  if(approachActive){
    ctx.textAlign='center'; ctx.font=`${cell*0.6}px monospace`;
    const t3='冒険篇　残り'+kanjiNum(Math.max(0,Math.ceil(approachTimer/1000)))+'秒';
    hudBackdrop(t3,W/2,8,'center'); ctx.fillStyle='#8affc8'; ctx.fillText(t3, W/2, 8);
    ctx.textAlign='left';
  }

  ctx.textAlign='right';
  if(gameMode==='timeattack'){
    const remain=Math.max(0,GAME_DURATION-elapsed), sec=Math.ceil(remain/1000);
    const t4=kanjiNum(sec)+'秒';
    hudBackdrop(t4,W-10,8,'right');
    ctx.fillStyle = sec<=10 ? '#ff3b3b' : '#ffffff';
    ctx.fillText(t4, W-10, 8);
  } else {
    const sec=Math.floor(elapsed/1000);
    const t4=kanjiNum(sec)+'秒経過';
    hudBackdrop(t4,W-10,8,'right');
    ctx.fillStyle = '#ffffff';
    ctx.fillText(t4, W-10, 8);
  }

  ctx.textAlign='left'; ctx.fillStyle='#ff5577';
  let hpStr=''; for(let i=0;i<player.maxHp;i++) hpStr += i<player.hp?'●':'○';
  ctx.fillText(hpStr + (invincibleMode?'　無敵':''), 10, H-cell*1.1);

  ctx.textAlign='right'; ctx.fillStyle='#99e6ff'; ctx.font=`${cell*0.55}px monospace`;
  ctx.fillText('緊急避難：連続接触'+kanjiNum(dodgeRequiredTaps())+'回'+(dodgeFreeMode?'（自由）':''), W-10, H-cell*1.1);
  ctx.restore();
}

// 要望対応：オープニング／スタッフロールは同種のスクロール演出のため描画処理を共通化
function drawScrollCredits(cfg){
  ctx.save();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const sc = cfg.scroll;
  const startY = H + cell*2;
  const endY = -sc.totalHeight - cell*2;
  const t = Math.min(1, sc.timer/sc.scrollMs);
  const baseY = startY + (endY-startY)*t;
  ctx.font=`${cell*0.75}px monospace`;
  cfg.lines.forEach((line,i)=>{
    const y = baseY + i*sc.lineHeight;
    if(y > -sc.lineHeight && y < H+sc.lineHeight){
      ctx.fillStyle = cfg.colorFn ? cfg.colorFn(line) : '#fff';
      ctx.fillText(line, W/2, y);
    }
  });
  if(cfg.hintVisible){
    ctx.fillStyle='#88ff88'; ctx.font=`${cell*0.5}px monospace`;
    ctx.fillText(cfg.hintText, W/2, H*0.95);
  }
  ctx.restore();
}
function drawOpening(){
  drawScrollCredits({
    lines: OPENING_LINES, scroll: openingScroll,
    hintText: 'タップで開始', hintVisible: hasSeenOpening()
  });
}

function drawStaffRoll(){
  drawScrollCredits({
    lines: STAFF_ROLL_LINES, scroll: staffRollScroll,
    hintText: 'タップで題名へ戻る', hintVisible: hasSeenStaffRoll(),
    colorFn: line => line.startsWith('©') ? '#888' : '#fff'
  });
}

function drawResult(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = resultReason==='gameover' ? '#ff5555' : (resultReason==='clear' ? '#ffe14d' : '#ffdd55');
  ctx.font=`bold ${cell*1.6}px monospace`;
  const title = resultReason==='gameover' ? '全滅' : (resultReason==='clear' ? '制覇' : '時間切れ');
  ctx.fillText(title+(runUsedFreeMode?'　★':''), W/2, H*0.32);
  ctx.fillStyle='#fff'; ctx.font=`${cell*1}px monospace`;
  ctx.fillText('得点　'+kanjiNum(score), W/2, H*0.44);
  ctx.font=`${cell*0.8}px monospace`;
  ctx.fillText('最大連撃　'+kanjiNum(comboMax), W/2, H*0.53);
  if(resultReason==='clear'){
    const cs = kanjiNum(Math.round(clearTimeMs/1000));
    ctx.fillStyle='#7fffb0';
    ctx.fillText('制覇時間　'+cs+'秒', W/2, H*0.62);
  }
  ctx.font=`${cell*0.7}px monospace`; ctx.fillStyle='#88ff88';
  ctx.fillText('接触で題名へ戻る', W/2, H*0.73);
  ctx.restore();
}

function frame(now){
  try{
    const dt=Math.min(50, now-lastTime); lastTime=now;
    trackFrameTiming(dt);
    pollGamepad();
    if(!paused){
      logicAccum += dt;
      while(logicAccum>=LOGIC_STEP){ updateLogic(LOGIC_STEP); logicAccum-=LOGIC_STEP; }
    }
    renderAccum += dt;
    if(renderAccum>=RENDER_STEP){ draw(); renderAccum=0; }
  } catch(e){
    // 堅牢性対応：ここで想定外の例外が起きても、ループ自体は止めない（1箇所のバグでゲーム全体が
    // 完全に固まる事態を避ける）。今回のPermissions-Policyの件のような、環境依存で予期せず
    // 例外を投げるAPIが今後出てきても被害を最小限にするための保険
    console.error('frame() error:', e);
  } finally {
    requestAnimationFrame(frame);
  }
}
resize();
startOpening();
requestAnimationFrame(frame);

})();
</script>

<script type="module">
  // ============ グローバルランキング（Firebase Firestore） ============
  // ここは独立したモジュールとして、window.KCRanking = { submitScore, getRanking } のみを
  // 上のゲーム本体スクリプトへ公開する。ゲーム側の変更は最小限（呼び出しの2関数のみ）。

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // motoikenkichi プロジェクトの実際のFirebase設定値（Firebaseコンソールより取得済み）
  const firebaseConfig = {
    apiKey: "AIzaSyB5OQMqMUJlTnRpsVtVG9NbFLSBsO6QoJE",
    authDomain: "motoikenkichi.firebaseapp.com",
    projectId: "motoikenkichi",
    storageBucket: "motoikenkichi.firebasestorage.app",
    messagingSenderId: "296584054759",
    appId: "1:296584054759:web:c7d9c62302d65a2c105f42"
  };

  const RANKING_COLLECTION = "kanjichosen_ranking";
  const MAX_NAME_LEN = 12;

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function submitScore(name, score, comboMax, clearTimeMs, usedFreeMode){
    const safeName = (name && String(name).trim()) ? String(name).trim().slice(0, MAX_NAME_LEN) : "匿名";
    // 要望対応：scoreはゲーム側でBigInt。従来はNumberへ変換していたため、連撃二乗で
    // 安全整数の範囲（2^53-1）を超えると精度が失われていた。文字列として送ることで
    // 精度を保つ。ソート順（orderBy）を数値順と一致させるため、固定桁数へゼロ埋めする
    // （24桁＝10^24-1まで対応。実用上、この桁数を超えるスコアは想定しない）
    const scoreBig = (typeof score === 'bigint' ? score : BigInt(Math.max(0, Math.floor(Number(score) || 0))));
    const scoreStr = (scoreBig < 0n ? 0n : scoreBig).toString().padStart(24, '0');
    await addDoc(collection(db, RANKING_COLLECTION), {
      name: safeName,
      score: scoreStr,
      comboMax: Math.max(0, Math.floor(comboMax)),
      clearTimeMs: Math.max(0, Math.floor(clearTimeMs)),
      usedFreeMode: !!usedFreeMode,
      createdAt: serverTimestamp()
    });
  }

  async function getRanking(){
    // スコア降順→同スコアなら時間昇順。複合クエリのため初回実行時に
    // Firestoreコンソールへ複合インデックス作成を促すリンクがエラーに表示されるので、
    // それをクリックして一度だけインデックスを作成してください。
    const q = query(
      collection(db, RANKING_COLLECTION),
      orderBy("score", "desc"),
      orderBy("clearTimeMs", "asc"),
      limit(10)
    );
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  }

  window.KCRanking = { submitScore, getRanking };
</script>
