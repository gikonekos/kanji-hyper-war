<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>漢字大戦</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #gameCanvas {
    display: block; width: 100vw; height: 100vh; background: #000;
  }
  #hint {
    position: fixed; bottom: 6px; left: 0; right: 0;
    text-align: center; color: #444; font-family: monospace;
    font-size: 11px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hint">タップして開始／ドラッグで移動／長押しで連射／すばやく2回タップで緊急避難（1回のみ）</div>
<script>
(function(){
"use strict";

/* ============================================================
   漢字大戦 - プロトタイプ実装
   ------------------------------------------------------------
   このビルドは会話で決めた仕様の骨格を実装したものです。
   未実装／簡略化している部分（メモ）:
   - 音楽はMML完全変換版ではなく、簡易オシレーター演出で代用
   - 漢字プールは常用漢字から抜粋した約80字（本来は128字を
     Unihanベースで厳選する予定）
   - 敵編隊パターン・動的難易度の重みづけは仮の値。実プレイで調整
   ============================================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/* ---------- 画面 / グリッド設定 ---------- */
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
let cols = 24, rows = 14; // 横持ち基準デフォルト
let cell = 20;
let isLandscape = true;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  isLandscape = W >= H;
  if (isLandscape) { cols = 24; rows = 14; }
  else { cols = 14; rows = 24; }
  cell = Math.min(W / cols, H / rows);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

function gx(gxu){ return (W - cols*cell)/2 + gxu*cell; }
function gy(gyu){ return (H - rows*cell)/2 + gyu*cell; }

/* ---------- 漢字プール（画数付き・仮） ---------- */
const KANJI_POOL = [
  ['一',1],['二',2],['三',3],['四',5],['五',4],['六',4],['七',2],['八',2],['九',2],['十',2],
  ['人',2],['大',3],['小',3],['山',3],['川',3],['田',5],['火',4],['水',4],['木',4],['金',8],
  ['土',3],['日',4],['月',4],['年',6],['学',8],['校',10],['生',5],['先',6],['気',6],['力',2],
  ['心',4],['花',7],['空',8],['雨',8],['風',9],['海',9],['石',5],['森',12],['林',8],['竜',10],
  ['星',9],['光',6],['電',13],['音',9],['楽',13],['語',14],['話',13],['読',14],['書',10],['記',10],
  ['時',10],['分',4],['秒',9],['週',11],['国',8],['王',4],['玉',5],['米',6],['虫',6],['鳥',11],
  ['犬',4],['馬',10],['魚',11],['車',7],['竹',6],['糸',6],['貝',7],['手',4],['目',5],['耳',6],
  ['口',3],['足',7],['頭',16],['顔',18],['体',7],['命',8],['愛',13],['夢',13],['恋',10],['龍',16]
];
const BOSS_KANJI = ['龍',16];

/* ---------- 漢数字変換 ---------- */
const KSU = ['','一','二','三','四','五','六','七','八','九'];
function conv4(n){
  if(n===0) return '';
  let s='';
  const th=Math.floor(n/1000), hu=Math.floor((n%1000)/100), te=Math.floor((n%100)/10), on=n%10;
  if(th) s += (th===1?'':KSU[th])+'千';
  if(hu) s += (hu===1?'':KSU[hu])+'百';
  if(te) s += (te===1?'':KSU[te])+'十';
  if(on) s += KSU[on];
  return s;
}
function kanjiNum(n){
  n = Math.max(0, Math.min(10000000, Math.floor(n)));
  if(n===0) return '〇';
  const man = Math.floor(n/10000), rest = n%10000;
  let s='';
  if(man) s += conv4(man)+'万';
  s += conv4(rest);
  return s || '〇';
}

/* ---------- 音（簡易ノイズ/オシレーター生成） ---------- */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function noiseBurst(dur, freqStart, freqEnd, gain){
  if(!actx) return;
  const bufSize = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufSize); }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.setValueAtTime(freqStart, actx.currentTime);
  filt.frequency.linearRampToValueAtTime(freqEnd, actx.currentTime+dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(gain, actx.currentTime);
  g.gain.linearRampToValueAtTime(0.0001, actx.currentTime+dur);
  src.connect(filt); filt.connect(g); g.connect(actx.destination);
  src.start();
}
function tone(freq, dur, gain){
  if(!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, actx.currentTime);
  g.gain.setValueAtTime(gain, actx.currentTime);
  g.gain.linearRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur);
}
const SFX = {
  shot(){ noiseBurst(0.06, 2200, 3200, 0.12); },
  hit(){ noiseBurst(0.08, 900, 400, 0.18); },
  destroy(){ noiseBurst(0.18, 700, 120, 0.22); },
  playerHit(){ noiseBurst(0.25, 300, 80, 0.28); },
  warning(){ tone(880,0.15,0.2); setTimeout(()=>tone(880,0.15,0.2),220); },
  dodge(){ noiseBurst(0.5, 1500, 100, 0.25); },
  start(){ tone(523,0.1,0.2); setTimeout(()=>tone(659,0.1,0.2),100); setTimeout(()=>tone(784,0.18,0.2),200); },
  stage(){ tone(392,0.12,0.18); setTimeout(()=>tone(523,0.12,0.18),120); setTimeout(()=>tone(659,0.2,0.18),240); },
  end(){ tone(440,0.2,0.2); setTimeout(()=>tone(330,0.35,0.2),200); }
};

/* ---------- 入力 ---------- */
const input = { active:false, x:0, y:0, downTime:0, lastTapTime:0, tapCount:0, dodgeUsed:false, dodgeRequested:false };

function toGridCoords(clientX, clientY){
  return { gx: (clientX-(W-cols*cell)/2)/cell, gy: (clientY-(H-rows*cell)/2)/cell };
}
function pointerDown(cx, cy){
  ensureAudio();
  input.active = true;
  input.downTime = performance.now();
  const p = toGridCoords(cx,cy);
  input.x = p.gx; input.y = p.gy;

  const now = performance.now();
  if(now - input.lastTapTime < 300){ input.tapCount++; } else { input.tapCount = 1; }
  input.lastTapTime = now;
  if(input.tapCount>=2 && !input.dodgeUsed){ input.dodgeRequested = true; input.tapCount = 0; }

  if(state === 'title'){ startGame(); }
  else if(state === 'result'){ state = 'title'; }
}
function pointerMove(cx, cy){
  if(!input.active) return;
  const p = toGridCoords(cx,cy);
  input.x = p.gx; input.y = p.gy;
}
function pointerUp(){ input.active = false; }

canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; pointerDown(t.clientX,t.clientY); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; pointerMove(t.clientX,t.clientY); }, {passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); pointerUp(); }, {passive:false});
canvas.addEventListener('mousedown', e=>{ pointerDown(e.clientX,e.clientY); });
canvas.addEventListener('mousemove', e=>{ pointerMove(e.clientX,e.clientY); });
canvas.addEventListener('mouseup', e=>{ pointerUp(); });

/* ---------- ゲーム状態 ---------- */
let state = 'title'; // title, playing, result
let elapsed = 0; // ms
const GAME_DURATION = 180000; // 3分
let stageIndex = 0;
let bossSpawnedFor = [false,false,false];
let bossActive = null;
let score = 0;
let combo = 0;
let comboMax = 0;
let resultReason = '';

const player = { x: cols/2, y: rows-2, hp: 5, maxHp: 5, invuln: 0, fireTimer: 0 };
let enemies = [];
let pBullets = [];
let eBullets = [];
let particles = [];
let popups = [];
let stars = [];

function initStars(){
  stars = [];
  const layers = [ {n:24,speed:6,ch:['・'],alpha:0.3,size:0.9},
                    {n:16,speed:12,ch:['*','・'],alpha:0.55,size:1.1},
                    {n:10,speed:22,ch:['✦','＊'.replace('＊','*')],alpha:0.85,size:1.4} ];
  layers.forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      stars.push({ layer:li, x:Math.random()*cols, y:Math.random()*rows, speed:L.speed,
                   ch:L.ch[Math.floor(Math.random()*L.ch.length)], alpha:L.alpha, size:L.size,
                   hue:Math.random()*360, hueSpeed:(20+Math.random()*40) });
    }
  });
}
initStars();
window.addEventListener('resize', initStars);

function strokesOf(entry){ return entry[1]; }

function spawnWaveIfNeeded(){
  const cap = stageIndex===0?6: stageIndex===1?8:10;
  if(enemies.length >= cap) return;
  if(Math.random() > (stageIndex===0?0.03:stageIndex===1?0.045:0.06)) return;

  const pick = KANJI_POOL[Math.floor(Math.random()*KANJI_POOL.length)];
  const strokes = strokesOf(pick);
  const hp = Math.max(1, Math.ceil(strokes/2));
  const x = 1 + Math.random()*(cols-2);
  let vx = 0, vy = 0.9 + stageIndex*0.25 + Math.random()*0.3;
  if(stageIndex===1 && Math.random()<0.4) vx = (Math.random()<0.5?-1:1)*0.6;
  if(stageIndex===2){ vx = Math.sin(x)*0.8; }
  enemies.push({
    ch: pick[0], strokes, hp, maxHp: hp, x, y: -1, vx, vy,
    fireTimer: 1000+Math.random()*2500, hitFlash:0
  });
}

function spawnBoss(){
  bossActive = { ch: BOSS_KANJI[0], strokes: BOSS_KANJI[1], hp: 40, maxHp: 40,
                 x: cols/2, y: -2, vx:0.6, vy:0.25, fireTimer:600, hitFlash:0, warnT: 1400 };
  SFX.warning();
}

function fireEnemyBullet(e, count){
  count = count||1;
  for(let i=0;i<count;i++){
    const spread = count>1 ? (i-(count-1)/2)*0.35 : 0;
    eBullets.push({ x:e.x, y:e.y+0.5, vx:spread, vy:5.5 });
  }
}

function addPopup(x,y,text,color){
  popups.push({ x, y, text, color, life:700, t:0 });
}

function addParticles(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({ x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4,
      life: 300+Math.random()*300, t:0, ch: (Math.random()<0.5?'炎':'火'), color });
  }
}

function damageEnemy(e, isBoss){
  e.hp -= 1;
  e.hitFlash = 120;
  SFX.hit();
  if(e.hp<=0){
    const base = isBoss ? 5000 : (e.strokes*20);
    combo++;
    comboMax = Math.max(comboMax, combo);
    const gained = Math.floor(base * (1 + combo*0.12));
    score = Math.min(10000000, score + gained);
    addParticles(e.x, e.y, isBoss?18:8, '#ff3b3b');
    addPopup(e.x, e.y, '連撃'+kanjiNum(combo), '#ffee33');
    SFX.destroy();
    if(isBoss){ bossActive = null; }
    return true;
  }
  return false;
}

function resetGame(){
  score = 0; combo = 0; comboMax = 0; elapsed = 0; stageIndex = 0;
  bossSpawnedFor = [false,false,false]; bossActive = null;
  enemies = []; pBullets = []; eBullets = []; particles = []; popups = [];
  player.x = cols/2; player.y = rows-2; player.hp = player.maxHp; player.invuln=0; player.fireTimer=0;
  input.dodgeUsed = false; input.dodgeRequested = false;
}
function startGame(){ resetGame(); state = 'playing'; SFX.start(); }
function endGame(reason){ state = 'result'; resultReason = reason; SFX.end(); }

/* ---------- 固定ステップ更新（60fps相当） ---------- */
const LOGIC_STEP = 1000/60;
let logicAccum = 0;
let lastTime = performance.now();

function updateLogic(dt){
  if(state !== 'playing') return;
  elapsed += dt;

  // ステージ判定（3分割の仮配分）
  const stageBounds = [60000,120000,180000];
  let ns = 0;
  if(elapsed>=stageBounds[0]) ns=1;
  if(elapsed>=stageBounds[1]) ns=2;
  if(ns !== stageIndex){ stageIndex = ns; SFX.stage(); }

  if(elapsed >= GAME_DURATION){ endGame('timeup'); return; }

  // ボス出現（各ステージ終盤5秒前）
  const bossAt = [55000,115000,175000];
  if(!bossSpawnedFor[stageIndex] && elapsed >= bossAt[stageIndex] && !bossActive){
    bossSpawnedFor[stageIndex] = true;
    spawnBoss();
  }

  // 緊急避難
  if(input.dodgeRequested){
    input.dodgeRequested = false;
    if(!input.dodgeUsed){
      input.dodgeUsed = true;
      enemies.forEach(e=>{ addParticles(e.x,e.y,6,'#66ccff'); score += Math.floor(e.strokes*10); });
      enemies = [];
      eBullets = [];
      if(bossActive){ addParticles(bossActive.x,bossActive.y,10,'#66ccff'); }
      // ボスは倒れない（避難は敵弾・雑魚のみ一掃）
      SFX.dodge();
      addPopup(player.x, player.y-1, '緊急避難', '#99e6ff');
    }
  }

  // 自機移動（タップ/ドラッグ追従）
  if(input.active){
    const tx = Math.max(0.5, Math.min(cols-0.5, input.x));
    const ty = Math.max(0.5, Math.min(rows-0.5, input.y));
    player.x += (tx-player.x)*0.35;
    player.y += (ty-player.y)*0.35;
  }
  if(player.invuln>0) player.invuln -= dt;

  // 発射（0.2秒ディレイ、接触中のみ）
  if(input.active){
    const held = performance.now() - input.downTime;
    if(held >= 200){
      player.fireTimer -= dt;
      if(player.fireTimer<=0){
        pBullets.push({ x:player.x, y:player.y-0.6, vx:0, vy:-7 });
        player.fireTimer = 140;
        SFX.shot();
      }
    }
  } else {
    player.fireTimer = 0;
  }

  // 敵スポーン
  spawnWaveIfNeeded();

  // 敵更新
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.x += e.vx*dt/1000; e.y += e.vy*dt/1000;
    if(e.hitFlash>0) e.hitFlash -= dt;
    e.fireTimer -= dt;
    if(e.fireTimer<=0 && e.y>0){ fireEnemyBullet(e,1); e.fireTimer = 1800+Math.random()*2200; }
    if(e.y > rows+2){ enemies.splice(i,1); combo = 0; } // 画面外に逃したらノーカウント（連撃は切らない：見逃しはミスと別扱い）
  }
  if(bossActive){
    const b = bossActive;
    if(b.warnT>0){ b.warnT -= dt; }
    else {
      b.y += b.vy*dt/1000;
      b.x += Math.sin(elapsed/900)* (dt/1000) * 1.2;
      b.x = Math.max(2, Math.min(cols-2, b.x));
      if(b.y > rows*0.28) b.vy = 0;
      b.fireTimer -= dt;
      if(b.fireTimer<=0){ fireEnemyBullet(b,3); b.fireTimer = 900; }
      if(b.hitFlash>0) b.hitFlash -= dt;
    }
  }

  // 自弾更新 + 命中判定
  for(let i=pBullets.length-1;i>=0;i--){
    const b = pBullets[i];
    b.x += b.vx*dt/1000; b.y += b.vy*dt/1000;
    let hit = false;

    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      const r = 0.35 + e.strokes/2*0.045; // 見た目サイズに応じた判定半径（大きめ）
      if(Math.hypot(b.x-e.x, b.y-e.y) < r){
        hit = true;
        const dead = damageEnemy(e,false);
        if(dead) enemies.splice(j,1);
        break;
      }
    }
    if(!hit && bossActive && bossActive.warnT<=0){
      const b2 = bossActive;
      const r = 0.9;
      if(Math.hypot(b.x-b2.x, b.y-b2.y) < r){
        hit = true;
        damageEnemy(b2, true);
      }
    }
    if(hit || b.y < -1){
      pBullets.splice(i,1);
      if(!hit){ combo = 0; } // 無駄うち＝連撃が切れる
    }
  }

  // 敵弾更新 + 自機命中判定
  for(let i=eBullets.length-1;i>=0;i--){
    const b = eBullets[i];
    b.x += b.vx*dt/1000; b.y += b.vy*dt/1000;
    if(b.y > rows+1 || b.x<-1 || b.x>cols+1){ eBullets.splice(i,1); continue; }
    if(player.invuln<=0){
      const r = 0.12; // 自機は1ドット判定（極小）
      if(Math.hypot(b.x-player.x, b.y-player.y) < r){
        eBullets.splice(i,1);
        player.hp -= 1; player.invuln = 1200; combo = 0;
        addParticles(player.x, player.y, 10, '#ff5555');
        SFX.playerHit();
        if(player.hp<=0){ endGame('gameover'); return; }
      }
    }
  }

  // パーティクル・ポップアップ
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.t += dt; p.x += p.vx*dt/1000; p.y += p.vy*dt/1000;
    if(p.t>p.life) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p = popups[i]; p.t += dt; p.y -= dt/1000*0.6;
    if(p.t>p.life) popups.splice(i,1);
  }

  // 星
  stars.forEach(s=>{
    s.y += s.speed*dt/1000/cell*cell/cell; // gridスケール補正
    s.y += 0; // (速度はcolsに依存させないシンプル実装)
    s.hue = (s.hue + s.hueSpeed*dt/1000) % 360;
    if(s.y>rows) { s.y = -1; s.x = Math.random()*cols; }
  });
}

/* ---------- 描画（30fps相当に間引き） ---------- */
let renderAccum = 0;
const RENDER_STEP = 1000/30;

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  drawStars();

  if(state === 'title'){ drawTitle(); }
  else if(state === 'playing'){ drawGame(); }
  else if(state === 'result'){ drawGame(); drawResult(); }
}

function drawStars(){
  stars.forEach(s=>{
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = `hsl(${s.hue},70%,65%)`;
    ctx.font = `${cell*s.size}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.ch, gx(s.x), gy(s.y));
    ctx.restore();
  });
}

function drawTitle(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#ff3b3b';
  ctx.font = `bold ${cell*3}px monospace`;
  ctx.fillText('漢字大戦', W/2, H*0.38);
  ctx.fillStyle = '#ffd23b';
  ctx.font = `${cell*0.9}px monospace`;
  ctx.fillText('タップしてスタート', W/2, H*0.55);
  ctx.fillStyle = '#3bb0ff';
  ctx.font = `${cell*0.6}px monospace`;
  ctx.fillText('― 3分間タイムアタック ―', W/2, H*0.62);
  ctx.restore();
}

function drawGame(){
  // プレイヤー
  ctx.save();
  ctx.globalAlpha = player.invuln>0 ? (Math.floor(elapsed/80)%2===0?0.3:1) : 1;
  ctx.fillStyle = '#3bff88';
  ctx.font = `bold ${cell*1.1}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('自', gx(player.x), gy(player.y));
  ctx.fillStyle = '#eaffea';
  ctx.font = `${cell*0.6}px monospace`;
  ctx.fillText('｜', gx(player.x), gy(player.y-0.75));
  ctx.restore();

  // 敵
  enemies.forEach(e=>{
    const size = cell*(0.7 + Math.min(1.6, e.strokes/16));
    ctx.save();
    ctx.fillStyle = e.hitFlash>0 ? '#ffffff' : '#ff8a3b';
    ctx.font = `${size}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e.ch, gx(e.x), gy(e.y));
    ctx.restore();
  });

  if(bossActive){
    const b = bossActive;
    ctx.save();
    if(b.warnT>0){
      if(Math.floor(elapsed/200)%2===0){
        ctx.fillStyle = '#ff2222';
        ctx.font = `bold ${cell*1.4}px monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('警告！', W/2, H*0.3);
      }
    } else {
      const size = cell*2.4;
      ctx.fillStyle = b.hitFlash>0 ? '#ffffff' : '#ff2b6a';
      ctx.font = `bold ${size}px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.ch, gx(b.x), gy(b.y));
      // HPバー
      const bw = cell*6, bh=cell*0.3;
      const bx = W/2-bw/2, by = gy(b.y)-size*0.65;
      ctx.strokeStyle = '#fff'; ctx.strokeRect(bx,by,bw,bh);
      ctx.fillStyle = '#ff2b6a';
      ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),bh);
    }
    ctx.restore();
  }

  // 自弾
  ctx.fillStyle = '#8aff3b';
  pBullets.forEach(b=>{ ctx.fillRect(gx(b.x)-1.5, gy(b.y)-cell*0.4, 3, cell*0.6); });
  // 敵弾
  ctx.fillStyle = '#ff3b3b';
  eBullets.forEach(b=>{ ctx.beginPath(); ctx.arc(gx(b.x),gy(b.y),cell*0.14,0,7); ctx.fill(); });

  // パーティクル
  particles.forEach(p=>{
    const a = 1-p.t/p.life;
    ctx.save(); ctx.globalAlpha = Math.max(0,a);
    ctx.fillStyle = p.color;
    ctx.font = `${cell*0.6}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.ch, gx(p.x), gy(p.y));
    ctx.restore();
  });

  // ポップアップ（FF風）
  popups.forEach(p=>{
    const a = 1-p.t/p.life;
    ctx.save(); ctx.globalAlpha = Math.max(0,a);
    ctx.fillStyle = p.color;
    ctx.font = `bold ${cell*0.7}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.text, gx(p.x), gy(p.y));
    ctx.restore();
  });

  // HUD
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.font = `bold ${Math.max(14,cell*0.75)}px monospace`;
  ctx.fillStyle = '#ffcc33';
  ctx.fillText('得点 '+kanjiNum(score), 10, 8);
  ctx.fillStyle = '#33e0ff';
  ctx.fillText('連撃 '+kanjiNum(combo), 10, 8+cell*0.9);

  const remain = Math.max(0, GAME_DURATION-elapsed);
  const sec = Math.ceil(remain/1000);
  ctx.textAlign='right';
  ctx.fillStyle = sec<=10 ? '#ff3b3b' : '#ffffff';
  ctx.fillText(String(sec)+'秒', W-10, 8);

  // ライフゲージ
  ctx.textAlign='left';
  ctx.fillStyle = '#ff5577';
  let hpStr = '';
  for(let i=0;i<player.maxHp;i++){ hpStr += i<player.hp ? '♥':'♡'; }
  ctx.fillText(hpStr.replace(/♥/g,'●').replace(/♡/g,'○'), 10, H-cell*1.1);

  if(!input.dodgeUsed){
    ctx.textAlign='right';
    ctx.fillStyle = '#99e6ff';
    ctx.font = `${cell*0.55}px monospace`;
    ctx.fillText('緊急避難：使用可', W-10, H-cell*1.1);
  }
  ctx.restore();
}

function drawResult(){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = resultReason==='gameover' ? '#ff5555' : '#ffdd55';
  ctx.font = `bold ${cell*1.6}px monospace`;
  ctx.fillText(resultReason==='gameover' ? 'GAME OVER' : 'ENDING', W/2, H*0.32);

  ctx.fillStyle = '#fff';
  ctx.font = `${cell*1}px monospace`;
  ctx.fillText('得点　'+kanjiNum(score), W/2, H*0.46);
  ctx.font = `${cell*0.8}px monospace`;
  ctx.fillText('最大連撃　'+kanjiNum(comboMax), W/2, H*0.55);

  ctx.font = `${cell*0.7}px monospace`;
  ctx.fillStyle = '#88ff88';
  ctx.fillText('タップしてタイトルへ', W/2, H*0.7);
  ctx.restore();
}

/* ---------- メインループ ---------- */
function frame(now){
  const dt = Math.min(50, now - lastTime); // 異常な大ジャンプを抑制
  lastTime = now;

  logicAccum += dt;
  while(logicAccum >= LOGIC_STEP){
    updateLogic(LOGIC_STEP);
    logicAccum -= LOGIC_STEP;
  }

  renderAccum += dt;
  if(renderAccum >= RENDER_STEP){
    draw();
    renderAccum = 0;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
